name: Sync Hardening Branch With Main Once

on:
  push:
    branches:
      - agent/project-hardening-handoff-readiness
    paths:
      - '.github/workflows/sync-hardening-main-once.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/project-hardening-handoff-readiness
          fetch-depth: 0

      - name: Merge current main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
          git push origin HEAD:agent/project-hardening-handoff-readiness
