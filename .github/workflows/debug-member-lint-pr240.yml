name: Temporary Member Diagnostics

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: temporary-member-diagnostics-pr240-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture Member checks
        id: checks
        shell: bash
        run: |
          set +e
          pnpm --filter @platform/web-member test > member-test.log 2>&1
          test_status=$?
          pnpm --filter @platform/web-member typecheck > member-typecheck.log 2>&1
          type_status=$?
          pnpm --filter @platform/web-member lint > member-lint.log 2>&1
          lint_status=$?
          cat member-test.log
          cat member-typecheck.log
          cat member-lint.log
          echo "test_status=$test_status" >> "$GITHUB_OUTPUT"
          echo "type_status=$type_status" >> "$GITHUB_OUTPUT"
          echo "lint_status=$lint_status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload Member diagnostic logs
        uses: actions/upload-artifact@v4
        with:
          name: temporary-member-diagnostics-${{ github.sha }}
          path: |
            member-test.log
            member-typecheck.log
            member-lint.log
          if-no-files-found: error
          retention-days: 1
      - name: Fail when a Member check failed
        shell: bash
        run: |
          test "${{ steps.checks.outputs.test_status }}" = "0"
          test "${{ steps.checks.outputs.type_status }}" = "0"
          test "${{ steps.checks.outputs.lint_status }}" = "0"
