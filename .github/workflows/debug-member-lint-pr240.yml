name: Temporary Member Lint Diagnostics

on:
  push:
    branches:
      - feat/admin-settings-media-system-v2

permissions:
  contents: read

concurrency:
  group: temporary-member-lint-pr240-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture Member lint
        id: lint
        shell: bash
        run: |
          set +e
          pnpm --filter @platform/web-member lint > member-lint.log 2>&1
          status=$?
          cat member-lint.log
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload Member lint log
        uses: actions/upload-artifact@v4
        with:
          name: temporary-member-lint-${{ github.sha }}
          path: member-lint.log
          if-no-files-found: error
          retention-days: 1
      - name: Fail when lint failed
        shell: bash
        run: exit "${{ steps.lint.outputs.exit_code }}"
