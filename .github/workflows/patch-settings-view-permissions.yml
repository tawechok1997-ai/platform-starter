name: Patch Strict Settings View Permissions

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/admin-settings-ui-system-v2
          fetch-depth: 0
      - name: Match Backend view permissions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          changes = [
            (
              Path('apps/web-admin/app/(admin)/settings/settings-section-page.tsx'),
              "  const canView = permission.can(`${resolvedPermissionBase}.view`) || permission.can(`${resolvedPermissionBase}.update`);",
              "  const canView = permission.can(`${resolvedPermissionBase}.view`);",
            ),
            (
              Path('apps/web-admin/app/(admin)/settings/page.tsx'),
              "  const allowedItems = useMemo(() => ITEMS.filter((settingsItem) => (\n    permission.can(`${settingsItem.permissionBase}.view`) || permission.can(`${settingsItem.permissionBase}.update`)\n  )), [permission]);",
              "  const allowedItems = useMemo(() => ITEMS.filter((settingsItem) => (\n    permission.can(`${settingsItem.permissionBase}.view`)\n  )), [permission]);",
            ),
            (
              Path('apps/web-admin/app/(admin)/settings/maintenance/maintenance-settings-client.tsx'),
              "  const canView = permission.can('settings.maintenance.view') || permission.can('settings.maintenance.update');",
              "  const canView = permission.can('settings.maintenance.view');",
            ),
          ]

          for path, old, new in changes:
            text = path.read_text()
            if old not in text:
              raise SystemExit(f'missing strict view replacement in {path}')
            path.write_text(text.replace(old, new, 1))
          PY

          git rm .github/workflows/patch-settings-view-permissions.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-admin/app/'(admin)'/settings
          git commit -m "fix(admin): require view permission before loading settings"
          git push origin HEAD:feat/admin-settings-ui-system-v2
