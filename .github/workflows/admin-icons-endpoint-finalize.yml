name: Admin Icons Endpoint Finalize

on:
  push:
    branches:
      - fix/admin-icons-settings-endpoint
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: admin-icons-endpoint-finalize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-icons-settings-endpoint
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Isolate logical settings groups and add regression test
        run: |
          python <<'PY'
          from pathlib import Path

          service = Path('apps/api/src/modules/settings/settings.service.ts')
          source = service.read_text()
          source = source.replace(
              "where: { group: GROUP_TO_PRISMA[group] as any },",
              "where: { group: GROUP_TO_PRISMA[group] as any, key: { startsWith: `${group}.` } },",
          )
          source = source.replace(
              "where: { group: GROUP_TO_PRISMA[group] as any, isPublic: true, isSensitive: false },",
              "where: { group: GROUP_TO_PRISMA[group] as any, key: { startsWith: `${group}.` }, isPublic: true, isSensitive: false },",
          )
          service.write_text(source)

          test = Path('apps/api/src/modules/settings/settings-icons.spec.ts')
          test.write_text(r'''import { GROUP_TO_PRISMA, PUBLIC_GROUPS, isSettingGroup } from './settings.constants';
import { SettingsService } from './settings.service';

describe('icon settings endpoint contract', () => {
  it('registers icons as a public logical group stored in BRANDING', () => {
    expect(isSettingGroup('icons')).toBe(true);
    expect(GROUP_TO_PRISMA.icons).toBe('BRANDING');
    expect(PUBLIC_GROUPS).toContain('icons');
  });

  it('loads only icons.* rows even though icons share the BRANDING enum', async () => {
    const findMany = jest.fn().mockResolvedValue([]);
    const prisma = { siteSetting: { findMany } } as any;
    const service = new SettingsService(prisma);

    await service.getAdminGroup('icons');

    expect(findMany).toHaveBeenCalledWith({
      where: { group: 'BRANDING', key: { startsWith: 'icons.' } },
      orderBy: { key: 'asc' },
    });
  });

  it('keeps branding queries isolated from icons rows', async () => {
    const findMany = jest.fn().mockResolvedValue([]);
    const prisma = { siteSetting: { findMany } } as any;
    const service = new SettingsService(prisma);

    await service.getAdminGroup('branding');

    expect(findMany).toHaveBeenCalledWith({
      where: { group: 'BRANDING', key: { startsWith: 'branding.' } },
      orderBy: { key: 'asc' },
    });
  });
});
''')
          PY
      - run: pnpm install --frozen-lockfile=false
      - name: API typecheck
        run: pnpm --filter @platform/api typecheck
      - name: Icon settings regression test
        run: pnpm --filter @platform/api test -- settings-icons.spec.ts --runInBand
      - name: API production build
        run: pnpm --filter @platform/api build
      - name: Commit validated fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/api/src/modules/settings/settings.service.ts apps/api/src/modules/settings/settings-icons.spec.ts
          if git diff --cached --quiet; then
            echo 'No validated changes to commit.'
            exit 0
          fi
          git commit -m 'test(settings): isolate icons from branding rows'
          git push origin HEAD:fix/admin-icons-settings-endpoint
