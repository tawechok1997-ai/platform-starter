name: Finalize Hardening Source Once

on:
  push:
    branches:
      - agent/project-hardening-handoff-readiness
    paths:
      - '.github/workflows/finalize-hardening-source-once.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/project-hardening-handoff-readiness
          fetch-depth: 0

      - name: Align production demo defaults and master worklist
        run: |
          python <<'PY'
          from pathlib import Path

          features_path = Path('apps/web-admin/app/(admin)/settings/features/page.tsx')
          features = features_path.read_text(encoding='utf-8')
          marker = "], null, 2);\n\nconst FEATURES_DEFAULTS = {"
          replacement = """], null, 2);

const TOURNAMENT_ITEMS_DEFAULT =
  process.env.NODE_ENV === 'production' &&
  process.env.NEXT_PUBLIC_ENABLE_DEMO_TOURNAMENT_DATA !== 'true'
    ? '[]'
    : DESKTOP_TOURNAMENT_MOCK_DEFAULTS;

const FEATURES_DEFAULTS = {"""
          if marker not in features and 'const TOURNAMENT_ITEMS_DEFAULT' not in features:
              raise SystemExit('Admin tournament defaults marker not found')
          features = features.replace(marker, replacement, 1)
          features = features.replace(
              'tournament_items_json: DESKTOP_TOURNAMENT_MOCK_DEFAULTS,',
              'tournament_items_json: TOURNAMENT_ITEMS_DEFAULT,',
              1,
          )
          features_path.write_text(features, encoding='utf-8')

          env_path = Path('.env.example')
          env_source = env_path.read_text(encoding='utf-8')
          demo_line = 'NEXT_PUBLIC_ENABLE_DEMO_TOURNAMENT_DATA=false'
          if demo_line not in env_source:
              anchor = 'NEXT_PUBLIC_API_URL=http://localhost:4000\n'
              if anchor not in env_source:
                  raise SystemExit('.env.example API URL marker not found')
              env_source = env_source.replace(anchor, anchor + demo_line + '\n', 1)
              env_path.write_text(env_source, encoding='utf-8')

          worklist_path = Path('docs/master-project-worklist.md')
          worklist = worklist_path.read_text(encoding='utf-8')
          worklist = worklist.replace(
              'วันที่จัดโครงสร้างล่าสุด: **2026-07-15**',
              'วันที่จัดโครงสร้างล่าสุด: **2026-07-31**',
              1,
          )
          hardening = """## Repository hardening baseline — 2026-07-31

- [x] Production build paths เป็น check-only และไม่แก้ tracked source/assets
- [x] API bootstrap, `/health` และ `/version` commit identity gate ใน CI
- [x] Admin/Member browser security headers และ environment-scoped CSP
- [x] Legacy executable public assets ถูก quarantine และมี automated audit
- [x] Shared API response cache แยกตาม actor/session namespace
- [x] Runtime environment, onboarding, troubleshooting และ handoff docs เป็นปัจจุบัน
- [x] Generated provider catalog headers ถูก normalize ใน source จริง
- [x] Demo Tournament data ปิดเป็นค่าเริ่มต้นใน production และต้องเปิดด้วย explicit flag

**หลักฐาน:** `docs/evidence/project-hardening-2026-07-31.md`, `docs/security/public-assets.md`, `docs/operations/repository-size-migration.md`

---

"""
          p0_marker = '# P0 — Core, schema และ financial safety\n'
          if '## Repository hardening baseline — 2026-07-31' not in worklist:
              if p0_marker not in worklist:
                  raise SystemExit('Master worklist P0 marker not found')
              worklist = worklist.replace(p0_marker, hardening + p0_marker, 1)
          worklist_path.write_text(worklist, encoding='utf-8')
          PY

      - name: Commit finalized source when needed
        run: |
          if git diff --quiet; then
            echo 'Hardening source is already finalized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web-admin/app/'(admin)'/settings/features/page.tsx .env.example docs/master-project-worklist.md
          git commit -m 'fix(config): keep demo tournament data opt-in in production'
          git push origin HEAD:agent/project-hardening-handoff-readiness
