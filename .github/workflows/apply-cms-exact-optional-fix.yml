name: Apply CMS Exact Optional Fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/admin-settings-media-system-v2
      - name: Apply exact optional callback type and remove temporary workflows
        shell: python
        run: |
          from pathlib import Path

          path = Path('apps/web-admin/src/features/cms/content-center-media-page.tsx')
          source = path.read_text(encoding='utf-8')
          before = 'onRemove?: () => void; onMoveUp?: () => void; onMoveDown?: () => void; children: ReactNode'
          after = 'onRemove?: (() => void) | undefined; onMoveUp?: (() => void) | undefined; onMoveDown?: (() => void) | undefined; children: ReactNode'
          count = source.count(before)
          if count != 1:
              raise SystemExit(f'Expected one LifecycleCard optional callback signature, found {count}')
          path.write_text(source.replace(before, after), encoding='utf-8')

          for workflow in [
              Path('.github/workflows/debug-media-typechecks.yml'),
              Path('.github/workflows/diagnose-admin-media-pr240.yml'),
              Path('.github/workflows/apply-cms-exact-optional-fix.yml'),
          ]:
              workflow.unlink(missing_ok=True)
      - name: Commit exact patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web-admin/src/features/cms/content-center-media-page.tsx .github/workflows
          git commit -m "fix(cms): support exact optional lifecycle actions"
          git push origin HEAD:feat/admin-settings-media-system-v2
