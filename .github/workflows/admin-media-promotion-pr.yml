name: Admin Media Promotion PR

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: admin-media-promotion-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  implement-and-verify:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/admin-media-promotion-system
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Extract and run product patch
        id: patch
        shell: bash
        run: |
          set +e
          python <<'PY' > media-patch.log 2>&1
          from pathlib import Path
          import re
          import textwrap
          workflow = Path('.github/workflows/admin-media-promotion-finalize.yml').read_text()
          match = re.search(r"^\s*python <<'PY'\n(?P<body>.*?)(?=^\s*PY\s*$)", workflow, flags=re.MULTILINE | re.DOTALL)
          if not match:
              raise SystemExit('Embedded product patch was not found')
          script = textwrap.dedent(match.group('body'))
          script = script.replace("    imageUrl: '',\n  href: '/games',", "    imageUrl: '',\n    href: '/games',")
          script = script.replace("    imageUrl: '',\n  desktopImageUrl: '',\n  mobileImageUrl: '',\n  href: '/games',", "    imageUrl: '',\n    desktopImageUrl: '',\n    mobileImageUrl: '',\n    href: '/games',")
          exec(compile(script, 'admin-media-promotion-patch.py', 'exec'))
          PY
          code=$?
          cat media-patch.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload patch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-media-patch-diagnostics
          path: media-patch.log
          if-no-files-found: error
          retention-days: 7
      - name: Stop after patch failure
        if: steps.patch.outputs.exit_code != '0'
        run: exit 1
      - run: pnpm install --frozen-lockfile=false
      - name: Admin tests
        run: pnpm --filter @platform/web-admin test
      - name: Admin typecheck
        run: pnpm --filter @platform/web-admin typecheck
      - name: Admin build
        run: pnpm --filter @platform/web-admin build
      - name: Promotion API tests
        run: pnpm --filter @platform/api test -- promotions-media.spec.ts --runInBand
      - name: API typecheck
        run: pnpm --filter @platform/api typecheck
      - name: API build
        run: pnpm --filter @platform/api build
      - name: Commit final product changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/admin-media-promotion-finalize.yml .github/workflows/admin-media-promotion-pr.yml docs/.trigger-admin-media-promotion-finalize
          git add apps/web-admin/src/features/cms apps/api/src/modules/promotions
          git commit -m 'feat(cms): add responsive promotion and content media'
          git push origin HEAD:feat/admin-media-promotion-system
