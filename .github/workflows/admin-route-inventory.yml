name: Admin Route Inventory

on:
  pull_request:
    paths:
      - 'apps/web-admin/app/**'
      - 'apps/web-admin/src/features/admin-modernization/**'
      - 'apps/web-admin/tools/audit-admin-routes.mjs'
      - 'apps/web-admin/package.json'
      - 'tests/authenticated-visual/**'
      - 'tools/audit-architecture-boundaries.mjs'
      - 'tools/admin-authenticated-ui-workflow.test.mjs'
      - '.github/workflows/admin-route-inventory.yml'
      - '.github/workflows/p5-security-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: admin-route-inventory-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    name: Generate route registry
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Apply bounded review fixes
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/admin-shell-responsive-layout'
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/p5-security-audit.yml').read_text(encoding='utf-8')
          start_marker = "          python <<'PY'\n"
          end_marker = "\n          PY\n\n          if git diff --quiet"
          if start_marker not in workflow or end_marker not in workflow:
              raise SystemExit('Bounded review patch markers were not found in P5 workflow.')
          source = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          source = '\n'.join(line[10:] if line.startswith('          ') else line for line in source.splitlines())
          exec(compile(source, '.github/workflows/p5-security-audit.yml:review-patch', 'exec'))
          PY

          if git diff --quiet; then
            echo 'Review fixes are already applied.'
            exit 0
          fi

          pnpm --filter @platform/web-admin lint
          pnpm --filter @platform/web-admin test
          pnpm --filter @platform/web-admin typecheck
          pnpm --filter @platform/web-admin inventory:admin-routes
          node tools/audit-architecture-boundaries.mjs
          node --test tools/admin-authenticated-ui-workflow.test.mjs

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            'apps/web-admin/app/(admin)/admin-nav.ts' \
            'apps/web-admin/app/(admin)/layout.tsx' \
            'apps/web-admin/app/(admin)/admin-nav-modernization.spec.ts' \
            'apps/web-admin/app/(admin)/admin-roles/page.tsx' \
            'apps/web-admin/app/admin-modern-governance.spec.ts' \
            'apps/web-admin/src/features/admin-modernization/data-table.tsx' \
            'apps/web-admin/src/features/admin-modernization/data-table-loading.spec.ts' \
            'apps/web-admin/tools/audit-admin-routes.mjs' \
            'apps/web-admin/package.json' \
            'apps/web-admin/src/features/admin-modernization/route-ownership.spec.ts' \
            'tests/authenticated-visual/admin-authenticated-workspace.spec.ts' \
            'tools/admin-authenticated-ui-workflow.test.mjs' \
            'tools/audit-architecture-boundaries.mjs' \
            'apps/web-admin/src/features/admin-modernization/workspace-tabs.tsx' \
            'apps/web-admin/src/features/admin-modernization/workspace-tabs.spec.ts'
          git commit -m 'fix(admin): address PR review safety feedback'
          git push origin HEAD:${GITHUB_HEAD_REF}

      - name: Generate Admin route inventory
        id: inventory
        run: pnpm --filter @platform/web-admin inventory:admin-routes

      - name: Publish inventory summary
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'docs/admin-route-registry.generated.json';
          if (!fs.existsSync(path)) {
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '## Admin route inventory\n\nRegistry generation did not produce an artifact.\n');
            process.exit(0);
          }
          const registry = JSON.parse(fs.readFileSync(path, 'utf8'));
          const unassigned = registry.routes.filter((route) => route.workspace === 'unassigned');
          const lines = [
            '## Admin route inventory',
            '',
            `- Total routes: **${registry.totalRoutes}**`,
            `- Unassigned routes: **${registry.unassignedCount}**`,
            `- Audit command result: **${{ steps.inventory.outcome }}**`,
            '',
          ];
          if (registry.workspaceCounts) {
            lines.push('### Workspace coverage', '');
            for (const [workspace, count] of Object.entries(registry.workspaceCounts)) {
              lines.push(`- ${workspace}: **${count}** routes`);
            }
            lines.push('');
          }
          if (unassigned.length) {
            lines.push('### Routes requiring ownership', '');
            for (const route of unassigned) lines.push(`- \`${route.route}\` from \`${route.source}\``);
          } else {
            lines.push('All discovered routes have a workspace owner.');
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join('\n')}\n`);
          NODE

      - name: Upload route registry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-route-registry
          path: docs/admin-route-registry.generated.json
          if-no-files-found: error
          retention-days: 14
