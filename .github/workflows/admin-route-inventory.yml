name: Admin Route Inventory

on:
  pull_request:
    paths:
      - 'apps/web-admin/app/**'
      - 'apps/web-admin/src/features/admin-modernization/**'
      - 'apps/web-admin/tools/audit-admin-routes.mjs'
      - 'apps/web-admin/package.json'
      - 'docs/admin-complete-route-coverage-spec.md'
      - '.github/workflows/admin-route-inventory.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-route-inventory-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    name: Generate route registry contract
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Generate Admin route inventory
        id: inventory
        run: pnpm --filter @platform/web-admin inventory:admin-routes

      - name: Publish inventory summary
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const registryPath = 'docs/admin-route-registry.generated.json';
          if (!fs.existsSync(registryPath)) {
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '## Admin route registry\n\nRegistry generation did not produce an artifact.\n');
            process.exit(0);
          }

          const registry = JSON.parse(fs.readFileSync(registryPath, 'utf8'));
          const lines = [
            '## Admin route registry contract',
            '',
            `- Schema version: **${registry.schemaVersion ?? 1}**`,
            `- Total routes: **${registry.totalRoutes}**`,
            `- Verified routes: **${registry.statusCounts?.verified ?? 0}**`,
            `- Implementing routes: **${registry.statusCounts?.implementing ?? 0}**`,
            `- Unassigned routes: **${registry.unassignedCount}**`,
            `- Permission gaps: **${registry.permissionGapCount ?? 0}**`,
            `- Contract findings: **${registry.contractFindingCount ?? 0}**`,
            `- Audit command result: **${{ steps.inventory.outcome }}**`,
            '',
          ];

          if (registry.workspaceCounts) {
            lines.push('### Workspace coverage', '');
            for (const [workspace, count] of Object.entries(registry.workspaceCounts)) {
              lines.push(`- ${workspace}: **${count}** routes`);
            }
            lines.push('');
          }

          if (registry.routeTypeCounts) {
            lines.push('### Route types', '');
            for (const [routeType, count] of Object.entries(registry.routeTypeCounts)) {
              lines.push(`- ${routeType}: **${count}** routes`);
            }
            lines.push('');
          }

          if (registry.contractFindings?.length) {
            lines.push('### Incomplete route contracts', '');
            for (const item of registry.contractFindings.slice(0, 50)) {
              lines.push(`- \`${item.route}\`: ${item.finding}`);
            }
            if (registry.contractFindings.length > 50) {
              lines.push(`- ...and ${registry.contractFindings.length - 50} more findings in the artifact`);
            }
          } else {
            lines.push('All discovered routes have complete ownership, permission, data, responsive, localization, state and test contracts.');
          }

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join('\n')}\n`);
          NODE

      - name: Upload route registry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-route-registry
          path: docs/admin-route-registry.generated.json
          if-no-files-found: error
          retention-days: 14
