name: Patch Settings Permission Alignment

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/admin-settings-ui-system-v2
          fetch-depth: 0
      - name: Align view and asset permissions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          settings = Path('apps/web-admin/app/(admin)/settings/settings-section-page.tsx')
          text = settings.read_text()
          replacements = [
            (
              "  const canView = permission.can(`${resolvedPermissionBase}.view`) || permission.can(`${resolvedPermissionBase}.update`);\n  const canUpdate = permission.can(`${resolvedPermissionBase}.update`);\n  const canLoad = permission.ready && canView;",
              "  const canView = permission.can(`${resolvedPermissionBase}.view`);\n  const canUpdate = permission.can(`${resolvedPermissionBase}.update`);\n  const canUploadAssets = canUpdate && permission.can('settings.features.update');\n  const canLoad = permission.ready && canView;",
            ),
            (
              "  async function uploadAsset(field: SettingsFieldConfig, file: File) {\n    if (!canUpdate) {\n      setMessage('บัญชีนี้ไม่มีสิทธิ์อัปโหลดไฟล์');",
              "  async function uploadAsset(field: SettingsFieldConfig, file: File) {\n    if (!canUploadAssets) {\n      setMessage('บัญชีนี้แก้ URL ได้ แต่ไม่มีสิทธิ์อัปโหลดไฟล์ใหม่ (ต้องใช้ settings.features.update)');",
            ),
            (
              "        {!canUpdate && <AdminNotice tone=\"warning\">โหมดอ่านอย่างเดียว ช่องกรอก การอัปโหลด และปุ่มบันทึกถูกปิดตามสิทธิ์ Backend ยังตรวจ permission ซ้ำทุกคำขอ</AdminNotice>}\n        <AdminUnsavedChangesNotice",
              "        {!canUpdate && <AdminNotice tone=\"warning\">โหมดอ่านอย่างเดียว ช่องกรอก การอัปโหลด และปุ่มบันทึกถูกปิดตามสิทธิ์ Backend ยังตรวจ permission ซ้ำทุกคำขอ</AdminNotice>}\n        {canUpdate && fields.some((field) => field.asset) && !canUploadAssets && <AdminNotice tone=\"warning\">บัญชีนี้แก้ URL รูปได้ แต่ปุ่มอัปโหลดไฟล์ถูกซ่อน เพราะ Asset Library ต้องใช้สิทธิ์ settings.features.update</AdminNotice>}\n        <AdminUnsavedChangesNotice",
            ),
            (
              "                            disabled={!canUpdate || busy}\n                            error={validationErrors[field.key]}",
              "                            disabled={!canUpdate || busy}\n                            canUpload={canUploadAssets}\n                            error={validationErrors[field.key]}",
            ),
            (
              "function FieldInput({ field, value, uploading, disabled, error, onChange, onUpload, onDisable, onRestore }: {\n  field: SettingsFieldConfig;\n  value: SettingsValue | undefined;\n  uploading: boolean;\n  disabled: boolean;\n  error: string | undefined;",
              "function FieldInput({ field, value, uploading, disabled, canUpload, error, onChange, onUpload, onDisable, onRestore }: {\n  field: SettingsFieldConfig;\n  value: SettingsValue | undefined;\n  uploading: boolean;\n  disabled: boolean;\n  canUpload: boolean;\n  error: string | undefined;",
            ),
            (
              "          {!disabled && <div className={styles.assetActions}>\n            <label className={styles.uploadButton}>\n              {uploading ? 'กำลังอัปโหลด...' : displayValue ? 'เปลี่ยนไฟล์' : 'อัปโหลดไฟล์'}\n              <input className={styles.hiddenInput} type=\"file\" accept=\"image/jpeg,image/png,image/webp,image/gif\" disabled={uploading} onChange={(event) => handleFileChange(event, onUpload)} />\n            </label>\n            <AdminButton",
              "          {!disabled && <div className={styles.assetActions}>\n            {canUpload && <label className={styles.uploadButton}>\n              {uploading ? 'กำลังอัปโหลด...' : displayValue ? 'เปลี่ยนไฟล์' : 'อัปโหลดไฟล์'}\n              <input className={styles.hiddenInput} type=\"file\" accept=\"image/jpeg,image/png,image/webp,image/gif\" disabled={uploading} onChange={(event) => handleFileChange(event, onUpload)} />\n            </label>}\n            <AdminButton",
            ),
          ]
          for old, new in replacements:
            if old not in text:
              raise SystemExit(f'missing settings replacement:\n{old}')
            text = text.replace(old, new, 1)
          settings.write_text(text)

          workspace = Path('apps/web-admin/app/(admin)/settings/page.tsx')
          text = workspace.read_text()
          old = "  const allowedItems = useMemo(() => ITEMS.filter((settingsItem) => (\n    permission.can(`${settingsItem.permissionBase}.view`) || permission.can(`${settingsItem.permissionBase}.update`)\n  )), [permission]);"
          new = "  const allowedItems = useMemo(() => ITEMS.filter((settingsItem) => (\n    permission.can(`${settingsItem.permissionBase}.view`)\n  )), [permission]);"
          if old not in text:
            raise SystemExit('missing workspace permission expression')
          workspace.write_text(text.replace(old, new, 1))

          maintenance = Path('apps/web-admin/app/(admin)/settings/maintenance/maintenance-settings-client.tsx')
          text = maintenance.read_text()
          old = "  const canView = permission.can('settings.maintenance.view') || permission.can('settings.maintenance.update');"
          new = "  const canView = permission.can('settings.maintenance.view');"
          if old not in text:
            raise SystemExit('missing maintenance permission expression')
          maintenance.write_text(text.replace(old, new, 1))
          PY

          git rm .github/workflows/patch-settings-asset-permission.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-admin/app/'(admin)'/settings
          git commit -m "fix(admin): align settings permissions with backend"
          git push origin HEAD:feat/admin-settings-ui-system-v2
