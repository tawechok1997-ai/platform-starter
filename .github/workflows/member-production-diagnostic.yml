name: Member Production Diagnostic

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/member-production-diagnostic.yml'

permissions:
  contents: read

jobs:
  inspect-member-production:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect Member Production
        shell: bash
        env:
          MEMBER_PRODUCTION_URL: https://platformweb-member-production.up.railway.app
          EXPECTED_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -u
          home_url="${MEMBER_PRODUCTION_URL%/}/"
          version_url="${MEMBER_PRODUCTION_URL%/}/api/version"

          echo "Expected SHA: $EXPECTED_SHA"
          echo "=== DNS ==="
          getent ahosts platformweb-member-production.up.railway.app || true

          echo "=== HOME ==="
          curl --location --show-error --connect-timeout 10 --max-time 30 \
            --dump-header /tmp/home-headers.txt --output /tmp/home.html \
            --write-out 'HTTP=%{http_code} FINAL=%{url_effective}\n' "$home_url" || true
          cat /tmp/home-headers.txt 2>/dev/null || true
          head -c 500 /tmp/home.html 2>/dev/null || true
          echo

          echo "=== VERSION ==="
          curl --location --show-error --connect-timeout 10 --max-time 30 \
            --dump-header /tmp/version-headers.txt --output /tmp/version.json \
            --write-out 'HTTP=%{http_code} FINAL=%{url_effective}\n' "$version_url" || true
          cat /tmp/version-headers.txt 2>/dev/null || true
          cat /tmp/version.json 2>/dev/null || true
          echo

          if grep -Fqi "$EXPECTED_SHA" /tmp/version.json 2>/dev/null \
            || grep -Fqi "${EXPECTED_SHA:0:12}" /tmp/version.json 2>/dev/null; then
            echo "SHA_MATCH=true"
          else
            echo "SHA_MATCH=false"
            exit 1
          fi
