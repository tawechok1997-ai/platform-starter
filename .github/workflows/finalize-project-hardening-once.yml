name: Finalize Project Hardening Once

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/finalize-project-hardening-once.yml'
      - 'tools/finalize-project-hardening-once.mjs'
      - 'package.json'
      - 'docs/master-project-worklist.md'
      - 'apps/api/src/modules/money-ops/money-ops.service.ts'
  push:
    branches:
      - agent/project-hardening-handoff-readiness
    paths:
      - '.github/workflows/finalize-project-hardening-once.yml'
      - 'tools/finalize-project-hardening-once.mjs'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/project-hardening-handoff-readiness
          fetch-depth: 0

      - name: Apply final source updates
        run: node tools/finalize-project-hardening-once.mjs

      - name: Commit final source updates when needed
        run: |
          if git diff --quiet; then
            echo 'Project hardening source is already finalized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(hardening): finalize runtime pins and production defaults'
          git push origin HEAD:agent/project-hardening-handoff-readiness
