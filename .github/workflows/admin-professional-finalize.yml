name: Admin Professional Finalize

on:
  push:
    branches:
      - fix/admin-professional-hierarchy-rbac
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: admin-professional-finalize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-professional-hierarchy-rbac
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply final shell, route guard and dashboard type integration
        run: |
          python <<'PY'
          from pathlib import Path

          protected = Path('apps/web-admin/app/(admin)/layout.tsx')
          source = protected.read_text()
          source = source.replace(
              "import { canAccessNavItem, localizedNavGroupDescription, localizedNavGroupTitle, localizedNavTitle, navGroups, requiredPermissionsForPath, resolveNavItemHref } from './admin-nav';",
              "import { canAccessNavItem, canAccessPath, localizedNavGroupDescription, localizedNavGroupTitle, localizedNavTitle, navGroups, resolveNavItemHref } from './admin-nav';",
          )
          source = source.replace(
              "  const required = requiredPermissionsForPath(pathname);\n  const canViewRoute = required.length === 0 || permissions.includes('*') || required.some((permission) => permissions.includes(permission));",
              "  const canViewRoute = canAccessPath(pathname, permissions);",
          )
          protected.write_text(source)

          dashboard = Path('apps/web-admin/app/(admin)/dashboard/dashboard-professional.tsx')
          dashboard_source = dashboard.read_text()
          metrics_type = """type DashboardMetrics = {
            deposit: number;
            withdrawal: number;
            net: number;
            maxFlow: number;
            total: number;
            available: number;
            locked: number;
            variance: number;
            walletBase: number;
            pendingTopUps: number;
            pendingWithdrawals: number;
            pendingTotal: number;
            oldestMinutes: number;
            riskCounts: Record<RiskAlert['severity'], number>;
            openRiskTotal: number;
            donut: string;
          };"""
          if 'type DashboardMetrics = {' not in dashboard_source:
              dashboard_source = dashboard_source.replace('type Copy = {', f'{metrics_type}\n\ntype Copy = {{', 1)
          dashboard_source = dashboard_source.replace('ReturnType<typeof useDashboardMetrics>', 'DashboardMetrics')
          marker = '\nfunction useDashboardMetrics() {'
          if marker in dashboard_source:
              dashboard_source = dashboard_source[:dashboard_source.index(marker)] + '\n'
          dashboard.write_text(dashboard_source)

          dashboard_css = Path('apps/web-admin/app/(admin)/dashboard/dashboard-professional.module.css')
          css_source = dashboard_css.read_text().replace('align-items: end;', 'align-items: flex-end;').replace('align-items: start;', 'align-items: flex-start;')
          dashboard_css.write_text(css_source)
          PY
      - run: pnpm install --frozen-lockfile=false
      - name: Admin route inventory
        run: pnpm --filter @platform/web-admin inventory:admin-routes
      - name: Admin capability audit
        run: pnpm --filter @platform/web-admin audit:admin-capabilities
      - name: Admin typecheck
        run: pnpm --filter @platform/web-admin typecheck
      - name: Admin tests
        run: pnpm --filter @platform/web-admin test
      - name: Admin production build
        run: pnpm --filter @platform/web-admin build
      - name: Commit final integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web-admin/app/'(admin)'/layout.tsx apps/web-admin/app/'(admin)'/dashboard/dashboard-professional.tsx apps/web-admin/app/'(admin)'/dashboard/dashboard-professional.module.css
          if git diff --cached --quiet; then
            echo 'No integration changes to commit.'
            exit 0
          fi
          git commit -m 'fix(admin): integrate professional shell and strict route guard'
          git push origin HEAD:fix/admin-professional-hierarchy-rbac
