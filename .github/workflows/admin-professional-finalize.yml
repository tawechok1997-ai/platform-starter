name: Admin Professional Finalize

on:
  push:
    branches:
      - fix/admin-professional-hierarchy-rbac
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: admin-professional-finalize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-professional-hierarchy-rbac
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply final shell and route guard integration
        run: |
          python <<'PY'
          from pathlib import Path
          import json

          protected = Path('apps/web-admin/app/(admin)/layout.tsx')
          source = protected.read_text()
          source = source.replace(
              "import { canAccessNavItem, localizedNavGroupDescription, localizedNavGroupTitle, localizedNavTitle, navGroups, requiredPermissionsForPath, resolveNavItemHref } from './admin-nav';",
              "import { canAccessNavItem, canAccessPath, localizedNavGroupDescription, localizedNavGroupTitle, localizedNavTitle, navGroups, resolveNavItemHref } from './admin-nav';",
          )
          source = source.replace(
              "  const required = requiredPermissionsForPath(pathname);\n  const canViewRoute = required.length === 0 || permissions.includes('*') || required.some((permission) => permissions.includes(permission));",
              "  const canViewRoute = canAccessPath(pathname, permissions);",
          )
          protected.write_text(source)

          root_layout = Path('apps/web-admin/app/layout.tsx')
          layout_source = root_layout.read_text()
          authority_import = "import './admin-professional-authority.css';"
          if authority_import not in layout_source:
              layout_source = layout_source.replace(
                  "import './admin-full-viewport-layout.css';",
                  "import './admin-full-viewport-layout.css';\nimport './admin-professional-authority.css';",
              )
          root_layout.write_text(layout_source)

          package_path = Path('apps/web-admin/package.json')
          package = json.loads(package_path.read_text())
          scripts = package.setdefault('scripts', {})
          scripts['audit:admin-capabilities'] = 'node --import tsx tools/audit-admin-capabilities.mjs'
          scripts['verify'] = 'pnpm inventory:admin-routes && pnpm audit:admin-capabilities && pnpm test && pnpm typecheck && pnpm build'
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n')
          PY
      - run: pnpm install --frozen-lockfile=false
      - name: Admin route inventory
        run: pnpm --filter @platform/web-admin inventory:admin-routes
      - name: Admin capability audit
        run: pnpm --filter @platform/web-admin audit:admin-capabilities
      - name: Admin typecheck
        run: pnpm --filter @platform/web-admin typecheck
      - name: Admin tests
        run: pnpm --filter @platform/web-admin test
      - name: Admin production build
        run: pnpm --filter @platform/web-admin build
      - name: Commit final integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web-admin/app/'(admin)'/layout.tsx apps/web-admin/app/layout.tsx apps/web-admin/package.json
          if git diff --cached --quiet; then
            echo 'No integration changes to commit.'
            exit 0
          fi
          git commit -m 'fix(admin): integrate professional shell and strict route guard'
          git push origin HEAD:fix/admin-professional-hierarchy-rbac
