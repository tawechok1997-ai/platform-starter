name: Temporary API Failure Diagnostic

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/temp-api-failure-diagnostic.yml'
      - 'apps/api/src/modules/game-platform/game-platform-money.service.ts'

permissions:
  contents: write

concurrency:
  group: temp-api-failure-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: platform_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d platform_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/platform_ci?schema=public
      FINANCE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/platform_ci?schema=public
      RISK_MATCH_SECRET: ci-risk-match-secret-value-2026
      KYC_ACCESS_SECRET: ci-kyc-access-secret-value-2026
      PHONE_OTP_SECRET: ci-phone-otp-secret-value-2026
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Run Build pre-test sequence
        run: |
          bash -n scripts/*.sh
          node --test tools/deployment-verification-workflow.test.mjs
          node --test tools/check-private-finance-storage.test.mjs
          node --test tools/require-prod-smoke-env.test.mjs
          node --test tools/member-production-smoke-workflow.test.mjs
          node --test tools/admin-authenticated-ui-workflow.test.mjs
          pnpm audit:architecture-inventory
          pnpm audit:architecture-boundaries
          pnpm audit:critical-test-safety
          pnpm audit:mutation-dto-coverage
          pnpm audit:critical-controller-types
          pnpm audit:critical-service-types
          pnpm audit:api-response-safety
          pnpm audit:error-code-catalog
          pnpm audit:critical-error-contracts
          pnpm audit:admin-permissions
          pnpm audit:admin-ui-permissions
          pnpm prisma validate
          pnpm prisma generate
          pnpm --filter @platform/api typecheck
          pnpm --filter @platform/web-admin typecheck
          pnpm --filter @platform/web-member typecheck
          pnpm prisma db push --skip-generate
          PSQL_DATABASE_URL="${DATABASE_URL%%\?*}"
          psql "$PSQL_DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20260714190000_add_promotion_domain_models/migration.sql
          psql "$PSQL_DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20260714191000_backfill_promotion_domain_models/migration.sql
          psql "$PSQL_DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20260714213000_add_risk_watchlist_domain/migration.sql
          psql "$PSQL_DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20260714213100_add_watchlist_risk_alert_type/migration.sql
          psql "$PSQL_DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20260714230000_add_kyc_document_domain/migration.sql
          psql "$PSQL_DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20260714230100_add_phone_otp_verification/migration.sql
      - name: Capture full API test failure
        run: |
          set +e
          pnpm --filter @platform/api exec jest --runInBand > /tmp/api-test.log 2>&1
          status=$?
          echo "$status" > /tmp/test-status
          echo "TEST_STATUS=$status" >> "$GITHUB_ENV"
          python - <<'PY'
          from pathlib import Path

          lines = Path('/tmp/api-test.log').read_text(encoding='utf-8', errors='replace').splitlines()
          status = Path('/tmp/test-status').read_text(encoding='utf-8').strip()
          keywords = (
              'FAIL ', '● ', 'Test Suites:', 'Tests:', 'Snapshots:', 'Ran all test suites',
              'Expected:', 'Received:', 'TypeError:', 'ReferenceError:', 'Cannot find',
              'AssertionError', 'Error:', 'toEqual', 'toBe(', 'at Object.', 'PrismaClient',
          )
          selected = set(range(max(0, len(lines) - 220), len(lines)))
          for index, line in enumerate(lines):
              if any(keyword in line for keyword in keywords):
                  selected.update(range(max(0, index - 18), min(len(lines), index + 25)))
          output = [f'TEST_STATUS={status}', '']
          previous = -2
          for index in sorted(selected):
              if index != previous + 1:
                  output.append('...')
              output.append(f'{index + 1}: {lines[index]}')
              previous = index
          Path('/tmp/temp-api-test-failure.txt').write_text('\n'.join(output[-1200:]) + '\n', encoding='utf-8')
          PY
      - name: Commit diagnostic summary to branch
        run: |
          git fetch origin fix/game-platform-legacy-webhook-receiver
          git checkout -B diagnostic-write origin/fix/game-platform-legacy-webhook-receiver
          cp /tmp/temp-api-test-failure.txt docs/evidence/temp-api-test-failure.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/evidence/temp-api-test-failure.txt
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Diagnostic summary is unchanged.'
          else
            git commit -m 'chore(ci): capture Build-equivalent API failure'
            git push origin HEAD:fix/game-platform-legacy-webhook-receiver
          fi
      - name: Preserve failing diagnostic status
        if: env.TEST_STATUS != '0'
        run: exit 1
