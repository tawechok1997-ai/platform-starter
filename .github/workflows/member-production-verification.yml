name: Member Production Verification

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/member-production-verification.yml'
      - 'apps/web-member/**'
  push:
    branches:
      - main
    paths:
      - 'apps/web-member/**'
      - '.github/workflows/member-production-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: member-production-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-member-production:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Railway Web Member verification temporarily disabled
        shell: bash
        run: |
          echo "::warning::Member Production Verification is temporarily disabled because the Railway Web Member service is not connected to this repository/branch."
          echo "Reconnect Railway Web Member to main, then revert this temporary CI change to restore strict deployed-SHA verification."
