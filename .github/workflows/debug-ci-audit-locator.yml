name: Temporary CI Audit Locator

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  locate:
    runs-on: ubuntu-latest
    steps:
      - name: Print API boundary violations
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const ref = context.payload.pull_request.head.sha;
            const commit = await github.rest.repos.getCommit({ owner, repo, ref });
            const tree = await github.rest.git.getTree({ owner, repo, tree_sha: commit.data.commit.tree.sha, recursive: 'true' });
            const allowed = new Set(['apps/web-admin/app/admin-api.ts', 'apps/web-member/app/member-api.ts']);
            const files = tree.data.tree.filter((entry) => entry.type === 'blob' && entry.path && /^apps\/web-(?:admin|member)\/.+\.(?:ts|tsx|js|jsx)$/.test(entry.path));
            const violations = [];
            for (const entry of files) {
              const path = entry.path;
              if (allowed.has(path) || /^apps\/web-(?:admin|member)\/app\/api\/.+\/route\.(?:ts|js)$/.test(path) || !entry.sha) continue;
              const blob = await github.rest.git.getBlob({ owner, repo, file_sha: entry.sha });
              const text = Buffer.from(blob.data.content, blob.data.encoding).toString('utf8');
              for (const rule of [
                ['direct fetch', /\bfetch\s*\(/g],
                ['axios import/use', /\baxios\b/g],
                ['duplicate adminFetch helper', /\b(?:function|const)\s+adminFetch\b/g],
                ['duplicate memberFetch helper', /\b(?:function|const)\s+memberFetch\b/g],
                ['duplicate fetchJson helper', /\b(?:function|const)\s+fetchJson\b/g],
              ]) {
                for (const match of text.matchAll(rule[1])) {
                  const line = text.slice(0, match.index).split('\n').length;
                  violations.push(`${path}:${line}: ${rule[0]}`);
                }
              }
            }
            console.log(`API_BOUNDARY_VIOLATIONS ${violations.length}`);
            for (const violation of violations) console.log(`API_BOUNDARY_ERROR ${violation}`);
