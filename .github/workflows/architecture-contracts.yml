name: Architecture Contracts

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  architecture-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Typecheck API
        run: pnpm typecheck:api

      - name: Test stable API error contracts
        run: pnpm --filter @platform/api exec jest error-code-resolver.spec.ts --runInBand

      - name: Audit architecture inventory
        run: pnpm audit:architecture-inventory

      - name: Audit architecture boundaries
        id: architecture_boundaries
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm audit:architecture-boundaries 2>&1 | tee architecture-boundaries.log

      - name: Upload architecture boundary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-boundary-evidence
          path: architecture-boundaries.log
          if-no-files-found: error
          retention-days: 14

      - name: Publish architecture boundary summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Architecture boundary audit'
            echo
            echo '- Outcome: **${{ steps.architecture_boundaries.outcome }}**'
            echo '- Full output: `architecture-boundary-evidence` artifact'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on architecture boundary violations
        if: steps.architecture_boundaries.outcome == 'failure'
        run: exit 1

      - name: Audit critical regression safety
        run: pnpm audit:critical-test-safety

      - name: Audit mutation DTO coverage
        run: pnpm audit:mutation-dto-coverage

      - name: Audit critical controller types
        run: pnpm audit:critical-controller-types

      - name: Audit critical service type debt
        run: pnpm audit:critical-service-types

      - name: Audit error code catalog
        run: pnpm audit:error-code-catalog

      - name: Audit critical error contracts
        run: pnpm audit:critical-error-contracts

      - name: Audit admin API permissions
        run: pnpm audit:admin-permissions

      - name: Audit admin UI permissions
        run: pnpm audit:admin-ui-permissions
