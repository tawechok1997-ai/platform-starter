name: Temporary Member Build Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - name: Capture Member production build
        shell: bash
        run: |
          set +e
          pnpm --filter @platform/web-member build > member-build.log 2>&1
          status=$?
          tail -n 250 member-build.log
          echo "$status" > member-build.exit
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: member-build-pr246-diagnostic
          path: |
            member-build.log
            member-build.exit
          if-no-files-found: error
          retention-days: 3
