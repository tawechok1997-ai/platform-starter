name: Temporary R-010 Game Platform Session Reconciliation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/api/src/modules/game-platform/game-platform-money.service.ts'
      - 'docs/evidence/r010-query-review.json'
      - '.github/workflows/temp-r010-game-platform-session-reconciliation.yml'

permissions:
  contents: write

concurrency:
  group: temp-r010-game-platform-session-reconciliation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/r010-game-platform-session-reconciliation
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - name: Remove legacy session reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          import json
          from pathlib import Path

          service_path = Path('apps/api/src/modules/game-platform/game-platform-money.service.ts')
          lines = service_path.read_text(encoding='utf-8').splitlines()
          targets = (
              'async reconcileSession(sessionId: string, actor?: AdminActor)',
              'private assertReconciliationSafetyGate(',
              'private async expectedProviderBalanceForSession(',
              'private async createReconciliationAlert(',
          )
          indexes = []
          for target in targets:
              matches = [index for index, line in enumerate(lines) if target in line]
              if len(matches) > 1:
                  raise SystemExit(f'expected at most one {target}, found {len(matches)}')
              if matches:
                  indexes.append(matches[0])
          for index in sorted(indexes, reverse=True):
              del lines[index]
          service_path.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          ledger_path = Path('docs/evidence/r010-query-review.json')
          ledger = json.loads(ledger_path.read_text(encoding='utf-8'))
          ledger['findings'].pop('duplicate:694a4a0fd6b2ec70fd6f20ef', None)
          ledger_path.write_text(json.dumps(ledger, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
      - name: Verify session reconciliation ownership
        shell: bash
        run: |
          pnpm --filter @platform/api exec jest src/modules/game-platform --runInBand --passWithNoTests
          pnpm typecheck:api
          R010_DUPLICATE_QUERY_STRICT=1 node tools/audit-r010-query-inventory.mjs
          node tools/audit-r010-query-review-ledger.mjs
      - name: Commit verified consolidation
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Session reconciliation consolidation is already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- apps/api/src/modules/game-platform/game-platform-money.service.ts docs/evidence/r010-query-review.json
          git commit -m 'refactor(game-platform): remove legacy session reconciliation'
          git push origin HEAD:fix/r010-game-platform-session-reconciliation
