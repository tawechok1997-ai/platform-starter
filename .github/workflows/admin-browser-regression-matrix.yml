name: Admin Dashboard Finalize Gate

on:
  push:
    branches:
      - fix/admin-dashboard-ux-density
    paths:
      - .github/workflows/admin-browser-regression-matrix.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/admin-browser-regression-matrix.yml

permissions:
  contents: write

concurrency:
  group: admin-dashboard-finalize-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    name: Sync main and finalize Admin dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Sync main and patch final compatibility issues
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-commit --no-ff origin/main
          python - <<'PY'
          from pathlib import Path

          css_path = Path('apps/web-admin/app/(admin)/dashboard/dashboard-redesigned.module.css')
          css = css_path.read_text(encoding='utf-8')
          count = css.count('align-items: end;')
          if count != 2:
              raise SystemExit(f'Expected exactly 2 align-items:end declarations, found {count}')
          css_path.write_text(css.replace('align-items: end;', 'align-items: flex-end;'), encoding='utf-8')

          tsx_path = Path('apps/web-admin/app/(admin)/dashboard/dashboard-redesigned.tsx')
          tsx = tsx_path.read_text(encoding='utf-8')
          if 'action={canViewWallet ?' in tsx:
              raise SystemExit('Legacy action={... : undefined} expression is still present')
          expected = "{...(canViewWallet ? { action: { href: '/wallet-ledgers', label: t.viewAll } } : {})}"
          if expected not in tsx:
              raise SystemExit('Conditional optional action prop spread is missing')
          PY

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Admin typecheck
        run: pnpm --filter @platform/web-admin typecheck

      - name: Admin tests
        run: pnpm --filter @platform/web-admin test

      - name: Admin production build
        run: pnpm --filter @platform/web-admin build

      - name: Commit and push finalized branch
        shell: bash
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          git add apps/web-admin/app/'(admin)'/dashboard/dashboard-redesigned.module.css
          git commit -m "chore(admin): sync main and finalize dashboard validation"
          git push origin "HEAD:${BRANCH_NAME}"
