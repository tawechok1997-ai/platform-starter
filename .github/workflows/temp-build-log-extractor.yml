name: Temporary Build Log Extractor

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/temp-build-log-extractor.yml'

permissions:
  actions: read
  contents: write

concurrency:
  group: temp-build-log-extractor-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/game-platform-legacy-webhook-receiver
          fetch-depth: 0
      - name: Download failed Build job log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/89811238503/logs" \
            --output /tmp/build-job-log
      - name: Extract failing test context
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, is_zipfile

          source = Path('/tmp/build-job-log')
          if is_zipfile(source):
              with ZipFile(source) as archive:
                  chunks = []
                  for name in archive.namelist():
                      if name.endswith('/'):
                          continue
                      chunks.append(archive.read(name).decode('utf-8', errors='replace'))
                  text = '\n'.join(chunks)
          else:
              text = source.read_bytes().decode('utf-8', errors='replace')

          lines = text.splitlines()
          keywords = (
              'FAIL ', '● ', 'Test Suites:', 'Tests:', 'Snapshots:', 'Ran all test suites',
              'Expected:', 'Received:', 'TypeError:', 'ReferenceError:', 'Cannot find',
              'AssertionError', 'toEqual', 'toBe(', 'at Object.', 'Jest did not exit',
              'Command failed', 'ELIFECYCLE', 'ERR_PNPM', 'Error:',
          )
          selected = set(range(max(0, len(lines) - 260), len(lines)))
          for index, line in enumerate(lines):
              if any(keyword in line for keyword in keywords):
                  selected.update(range(max(0, index - 20), min(len(lines), index + 32)))

          output = []
          previous = -2
          for index in sorted(selected):
              if index != previous + 1:
                  output.append('...')
              output.append(f'{index + 1}: {lines[index]}')
              previous = index

          Path('/tmp/temp-build-api-failure.txt').write_text(
              '\n'.join(output[-1600:]) + '\n',
              encoding='utf-8',
          )
          PY
      - name: Publish extracted failure through Contents API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64
          import json
          from pathlib import Path

          content = base64.b64encode(
              Path('/tmp/temp-build-api-failure.txt').read_bytes()
          ).decode('ascii')
          payload = {
              'message': 'chore(ci): capture failed Build API test context',
              'content': content,
              'branch': 'fix/game-platform-legacy-webhook-receiver',
          }
          Path('/tmp/contents-payload.json').write_text(
              json.dumps(payload),
              encoding='utf-8',
          )
          PY
          curl --fail --silent --show-error \
            --request PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/docs/evidence/temp-build-api-failure.txt" \
            --data-binary @/tmp/contents-payload.json
