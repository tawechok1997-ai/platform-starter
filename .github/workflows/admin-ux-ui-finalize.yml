name: Admin UX UI Finalizer

on:
  push:
    branches:
      - agent/admin-ux-ui-overhaul
    paths:
      - .github/workflows/admin-ux-ui-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout overhaul branch
        uses: actions/checkout@v4
        with:
          ref: agent/admin-ux-ui-overhaul
          fetch-depth: 0

      - name: Remove unrelated generated files
        shell: bash
        env:
          BRANCH_NAME: agent/admin-ux-ui-overhaul
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout origin/main -- \
            "apps/web-admin/next-env.d.ts" \
            "apps/web-admin/tsconfig.json"
          git rm -r --ignore-unmatch "apps/web-admin/public/assets/reference-brand"
          git add "apps/web-admin/next-env.d.ts" "apps/web-admin/tsconfig.json"
          git diff --cached --stat
          git commit -m "chore(admin): remove unrelated generated artifacts"
          git push origin "HEAD:${BRANCH_NAME}"
