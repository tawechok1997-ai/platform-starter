name: Temporary R-010 Money Ops Ledger Consolidation

on:
  push:
    branches:
      - fix/r010-money-ops-ledger-consolidation
  pull_request:
    branches:
      - main
    paths:
      - 'apps/api/src/modules/money-ops/money-ops.service.ts'
      - 'docs/evidence/r010-query-review.json'
      - '.github/workflows/temp-r010-money-ops-ledger-consolidation.yml'

permissions:
  contents: write

concurrency:
  group: temp-r010-money-ops-ledger-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/r010-money-ops-ledger-consolidation
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - name: Remove legacy Money Ops ledger query
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          import json
          from pathlib import Path

          service_path = Path('apps/api/src/modules/money-ops/money-ops.service.ts')
          source = service_path.read_text(encoding='utf-8')
          lines = source.splitlines()
          matches = [index for index, line in enumerate(lines) if 'async listLedger(query:' in line]
          if len(matches) == 1:
              del lines[matches[0]]
              service_path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          elif len(matches) != 0:
              raise SystemExit(f'expected at most one legacy listLedger method, found {len(matches)}')

          ledger_path = Path('docs/evidence/r010-query-review.json')
          ledger = json.loads(ledger_path.read_text(encoding='utf-8'))
          key = 'duplicate:2d99292a0c07f3a187e5a76e'
          ledger['findings'].pop(key, None)
          ledger_path.write_text(json.dumps(ledger, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
      - name: Verify Money Ops query ownership
        shell: bash
        run: |
          pnpm --filter @platform/api exec jest src/modules/money-ops --runInBand --passWithNoTests
          pnpm typecheck:api
          R010_DUPLICATE_QUERY_STRICT=1 node tools/audit-r010-query-inventory.mjs
          node tools/audit-r010-query-review-ledger.mjs
      - name: Commit verified consolidation
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Money Ops ledger consolidation is already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- apps/api/src/modules/money-ops/money-ops.service.ts docs/evidence/r010-query-review.json
          git commit -m 'refactor(money-ops): remove legacy ledger query'
          git push origin HEAD:fix/r010-money-ops-ledger-consolidation
