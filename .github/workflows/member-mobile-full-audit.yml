name: Member Mobile Full Audit

on:
  pull_request:
    paths:
      - 'apps/web-member/**'
      - 'tests/e2e-visual/r013-member-mobile-*-audit.spec.ts'
      - 'playwright.member-mobile-audit.config.ts'
      - '.github/workflows/member-mobile-full-audit.yml'
  workflow_dispatch:

concurrency:
  group: member-mobile-full-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  member-mobile-full-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm exec playwright install --with-deps chromium
      - name: Audit Production Mobile Home and Guest Routes
        env:
          MEMBER_HOME_URL: https://platformweb-member-production.up.railway.app/
        run: >-
          pnpm exec playwright test
          tests/e2e-visual/r013-member-mobile-full-audit.spec.ts
          -c playwright.member-mobile-audit.config.ts
          --grep "home geometry|guest route matrix"
          --retries=0
      - name: Audit Read-only Authenticated Interactions
        env:
          MEMBER_HOME_URL: https://platformweb-member-production.up.railway.app/
        run: >-
          pnpm exec playwright test
          tests/e2e-visual/r013-member-mobile-authenticated-audit.spec.ts
          -c playwright.member-mobile-audit.config.ts
          --grep "authenticated shell"
          --retries=0
      - name: Audit Dedicated Authenticated Mobile Routes
        env:
          MEMBER_HOME_URL: https://platformweb-member-production.up.railway.app/
        run: >-
          pnpm exec playwright test
          tests/e2e-visual/r013-member-mobile-authenticated-routes-v3-audit.spec.ts
          -c playwright.member-mobile-audit.config.ts
          --retries=0
      - name: Audit Guest Protected Routes
        env:
          MEMBER_HOME_URL: https://platformweb-member-production.up.railway.app/
        run: >-
          pnpm exec playwright test
          tests/e2e-visual/r013-member-mobile-protected-route-audit.spec.ts
          -c playwright.member-mobile-audit.config.ts
          --grep "guest cannot"
          --retries=0
      - name: Audit Read-only Protected Routes
        env:
          MEMBER_HOME_URL: https://platformweb-member-production.up.railway.app/
        run: >-
          pnpm exec playwright test
          tests/e2e-visual/r013-member-mobile-protected-authenticated-routes-v3-audit.spec.ts
          -c playwright.member-mobile-audit.config.ts
          --retries=0
      - name: Upload Member Mobile audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: member-mobile-full-audit-evidence
          path: artifacts/member-mobile-audit/**
          if-no-files-found: error
          retention-days: 14
