name: Admin Media Promotion Finalize

on:
  push:
    branches:
      - feat/admin-media-promotion-system
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: admin-media-promotion-finalize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/admin-media-promotion-system
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Implement responsive CMS and promotion media
        run: |
          python <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              file = Path(path)
              source = file.read_text()
              if old not in source:
                  raise SystemExit(f'Expected marker not found in {path}: {old[:100]!r}')
              file.write_text(source.replace(old, new, count))

          contract = 'apps/web-admin/src/features/cms/content-center-contract.ts'
          replace(contract,
          """export type CmsBanner = CmsLifecycleState & {
            title: string;
            subtitle: string;
            imageUrl: string;
            href: string;
            assetId?: string | undefined;
          };""",
          """export type CmsBanner = CmsLifecycleState & {
            title: string;
            subtitle: string;
            imageUrl: string;
            desktopImageUrl?: string | undefined;
            mobileImageUrl?: string | undefined;
            href: string;
            assetId?: string | undefined;
            desktopAssetId?: string | undefined;
            mobileAssetId?: string | undefined;
          };""")
          replace(contract,
          """export type CmsAnnouncement = CmsLifecycleState & {
            title: string;
            message: string;
          };""",
          """export type CmsAnnouncement = CmsLifecycleState & {
            title: string;
            message: string;
            kind?: 'news' | 'event' | 'promotion' | 'system' | undefined;
            href?: string | undefined;
            imageUrl?: string | undefined;
            desktopImageUrl?: string | undefined;
            mobileImageUrl?: string | undefined;
            assetId?: string | undefined;
            desktopAssetId?: string | undefined;
            mobileAssetId?: string | undefined;
          };""")
          replace(contract,
          """    imageUrl: '',
            href: '/games',""",
          """    imageUrl: '',
            desktopImageUrl: '',
            mobileImageUrl: '',
            href: '/games',""")
          replace(contract,
          """    title: 'ระบบพร้อมใช้งาน',
            message: 'ฝาก ถอน และเกมเปิดให้บริการตามปกติ',
            enabled: true,""",
          """    title: 'ระบบพร้อมใช้งาน',
            message: 'ฝาก ถอน และเกมเปิดให้บริการตามปกติ',
            kind: 'system',
            href: '/support',
            imageUrl: '',
            desktopImageUrl: '',
            mobileImageUrl: '',
            enabled: true,""")
          replace(contract,
          """      imageUrl: String(item.imageUrl ?? ''),
              href: String(item.href ?? '/games'),
              lifecycle,
              enabled: lifecycle === 'published' && item.enabled !== false,
              assetId: String(item.assetId ?? ''),""",
          """      imageUrl: String(item.imageUrl ?? item.desktopImageUrl ?? ''),
              desktopImageUrl: String(item.desktopImageUrl ?? item.imageUrl ?? ''),
              mobileImageUrl: String(item.mobileImageUrl ?? item.imageUrl ?? item.desktopImageUrl ?? ''),
              href: String(item.href ?? '/games'),
              lifecycle,
              enabled: lifecycle === 'published' && item.enabled !== false,
              assetId: String(item.assetId ?? item.desktopAssetId ?? ''),
              desktopAssetId: String(item.desktopAssetId ?? item.assetId ?? ''),
              mobileAssetId: String(item.mobileAssetId ?? item.assetId ?? item.desktopAssetId ?? ''),""")
          replace(contract,
          """      title: String(item.title ?? ''),
              message: String(item.message ?? ''),
              lifecycle,
              enabled: lifecycle === 'published' && item.enabled !== false,""",
          """      title: String(item.title ?? ''),
              message: String(item.message ?? ''),
              kind: item.kind === 'news' || item.kind === 'event' || item.kind === 'promotion' ? item.kind : 'system',
              href: String(item.href ?? ''),
              imageUrl: String(item.imageUrl ?? item.desktopImageUrl ?? ''),
              desktopImageUrl: String(item.desktopImageUrl ?? item.imageUrl ?? ''),
              mobileImageUrl: String(item.mobileImageUrl ?? item.imageUrl ?? item.desktopImageUrl ?? ''),
              assetId: String(item.assetId ?? item.desktopAssetId ?? ''),
              desktopAssetId: String(item.desktopAssetId ?? item.assetId ?? ''),
              mobileAssetId: String(item.mobileAssetId ?? item.assetId ?? item.desktopAssetId ?? ''),
              lifecycle,
              enabled: lifecycle === 'published' && item.enabled !== false,""")

          page = 'apps/web-admin/src/features/cms/content-center-page.tsx'
          replace(page,
          """                <AssetSelect value={item.assetId ?? ''} assets={content.assets} onChange={(assetId) => patchBanner(index, { assetId, imageUrl: assetUrl(content.assets, assetId) || item.imageUrl }, setContent)} />
                          <Field label=\"ลิงก์รูป\" value={item.imageUrl} onChange={(value) => patchBanner(index, { imageUrl: value, assetId: '' }, setContent)} warning={item.imageUrl && !isAssetUrl(item.imageUrl) ? 'URL รูปไม่ถูกต้อง' : undefined} />""",
          """                <AssetSelect label=\"Asset สำหรับ Desktop\" value={item.desktopAssetId ?? item.assetId ?? ''} assets={content.assets} onChange={(desktopAssetId) => patchBanner(index, { desktopAssetId, assetId: desktopAssetId, desktopImageUrl: assetUrl(content.assets, desktopAssetId) || item.desktopImageUrl || item.imageUrl, imageUrl: assetUrl(content.assets, desktopAssetId) || item.imageUrl }, setContent)} />
                          <Field label=\"รูป Desktop URL\" value={item.desktopImageUrl ?? item.imageUrl} onChange={(value) => patchBanner(index, { desktopImageUrl: value, imageUrl: value, desktopAssetId: '', assetId: '' }, setContent)} warning={(item.desktopImageUrl ?? item.imageUrl) && !isAssetUrl(item.desktopImageUrl ?? item.imageUrl) ? 'URL รูป Desktop ไม่ถูกต้อง' : undefined} />
                          <AssetSelect label=\"Asset สำหรับ Mobile\" value={item.mobileAssetId ?? ''} assets={content.assets} onChange={(mobileAssetId) => patchBanner(index, { mobileAssetId, mobileImageUrl: assetUrl(content.assets, mobileAssetId) || item.mobileImageUrl || item.imageUrl }, setContent)} />
                          <Field label=\"รูป Mobile URL\" value={item.mobileImageUrl ?? item.imageUrl} onChange={(value) => patchBanner(index, { mobileImageUrl: value, mobileAssetId: '' }, setContent)} warning={(item.mobileImageUrl ?? item.imageUrl) && !isAssetUrl(item.mobileImageUrl ?? item.imageUrl) ? 'URL รูป Mobile ไม่ถูกต้อง' : undefined} />""")
          replace(page,
          """                  imageUrl: '',
                          href: '/games',""",
          """                  imageUrl: '',
                          desktopImageUrl: '',
                          mobileImageUrl: '',
                          href: '/games',""")
          replace(page,
          """                <Field label=\"หัวข้อ\" value={item.title} onChange={(value) => patchAnnouncement(index, { title: value }, setContent)} />
                          <Field label=\"ข้อความ\" value={item.message} onChange={(value) => patchAnnouncement(index, { message: value }, setContent)} textarea />""",
          """                <Field label=\"หัวข้อ\" value={item.title} onChange={(value) => patchAnnouncement(index, { title: value }, setContent)} />
                          <label style={fieldStyle}><span>ประเภทเนื้อหา</span><select value={item.kind ?? 'system'} onChange={(event) => patchAnnouncement(index, { kind: event.target.value as CmsAnnouncement['kind'] }, setContent)} style={inputStyle}><option value=\"news\">ข่าวสาร</option><option value=\"event\">กิจกรรม</option><option value=\"promotion\">โปรโมชัน</option><option value=\"system\">ประกาศระบบ</option></select></label>
                          <Field label=\"ข้อความ\" value={item.message} onChange={(value) => patchAnnouncement(index, { message: value }, setContent)} textarea />
                          <Field label=\"ลิงก์ปลายทาง\" value={item.href ?? ''} onChange={(value) => patchAnnouncement(index, { href: value }, setContent)} warning={item.href && !isSafeHref(item.href) ? 'ลิงก์ควรขึ้นต้น / หรือ http/https' : undefined} />
                          <AssetSelect label=\"Asset สำหรับ Desktop\" value={item.desktopAssetId ?? item.assetId ?? ''} assets={content.assets} onChange={(desktopAssetId) => patchAnnouncement(index, { desktopAssetId, assetId: desktopAssetId, desktopImageUrl: assetUrl(content.assets, desktopAssetId) || item.desktopImageUrl || item.imageUrl, imageUrl: assetUrl(content.assets, desktopAssetId) || item.imageUrl }, setContent)} />
                          <Field label=\"รูป Desktop URL\" value={item.desktopImageUrl ?? item.imageUrl ?? ''} onChange={(value) => patchAnnouncement(index, { desktopImageUrl: value, imageUrl: value, desktopAssetId: '', assetId: '' }, setContent)} warning={(item.desktopImageUrl ?? item.imageUrl) && !isAssetUrl(item.desktopImageUrl ?? item.imageUrl ?? '') ? 'URL รูป Desktop ไม่ถูกต้อง' : undefined} />
                          <AssetSelect label=\"Asset สำหรับ Mobile\" value={item.mobileAssetId ?? ''} assets={content.assets} onChange={(mobileAssetId) => patchAnnouncement(index, { mobileAssetId, mobileImageUrl: assetUrl(content.assets, mobileAssetId) || item.mobileImageUrl || item.imageUrl }, setContent)} />
                          <Field label=\"รูป Mobile URL\" value={item.mobileImageUrl ?? item.imageUrl ?? ''} onChange={(value) => patchAnnouncement(index, { mobileImageUrl: value, mobileAssetId: '' }, setContent)} warning={(item.mobileImageUrl ?? item.imageUrl) && !isAssetUrl(item.mobileImageUrl ?? item.imageUrl ?? '') ? 'URL รูป Mobile ไม่ถูกต้อง' : undefined} />""")
          replace(page,
          """                  title: 'ประกาศใหม่',
                          message: '',
                          enabled: false,""",
          """                  title: 'ประกาศใหม่',
                          message: '',
                          kind: 'news',
                          href: '',
                          imageUrl: '',
                          desktopImageUrl: '',
                          mobileImageUrl: '',
                          enabled: false,""")
          replace(page,
          """function AssetSelect({ value, assets, onChange }: { value: string; assets: CmsAsset[]; onChange: (assetId: string) => void }) {""",
          """function AssetSelect({ label = 'เลือกจาก Asset Library', value, assets, onChange }: { label?: string; value: string; assets: CmsAsset[]; onChange: (assetId: string) => void }) {""")
          replace(page, "<span>เลือกจาก Asset Library</span>", "<span>{label}</span>")
          replace(page,
          """  const bannerImage = banner ? assetUrl(content.assets, banner.assetId) || banner.imageUrl : '';""",
          """  const bannerImage = banner ? assetUrl(content.assets, banner.mobileAssetId) || banner.mobileImageUrl || assetUrl(content.assets, banner.desktopAssetId ?? banner.assetId) || banner.desktopImageUrl || banner.imageUrl : '';""", 1)
          replace(page,
          """      {announcements.map((item, index) => <div key={index} style={phoneCardStyle}><strong>{item.title || 'ประกาศ'}</strong><span>{item.message || 'ข้อความประกาศ'}</span></div>)}""",
          """      {announcements.map((item, index) => { const image = assetUrl(content.assets, item.mobileAssetId) || item.mobileImageUrl || assetUrl(content.assets, item.desktopAssetId ?? item.assetId) || item.desktopImageUrl || item.imageUrl || ''; return <div key={index} style={phoneCardStyle}>{image && isAssetUrl(image) && <img src={resolveAssetUrl(image)} alt=\"\" style={phoneImageStyle} />}<small>{item.kind ?? 'system'}</small><strong>{item.title || 'ประกาศ'}</strong><span>{item.message || 'ข้อความประกาศ'}</span></div>; })}""")
          replace(page,
          """  const bannerImage = banner ? assetUrl(content.assets, banner.assetId) || banner.imageUrl : '';""",
          """  const bannerImage = banner ? assetUrl(content.assets, banner.desktopAssetId ?? banner.assetId) || banner.desktopImageUrl || banner.imageUrl : '';""", 1)
          replace(page,
          """      <section style={desktopAnnouncementStyle}>{announcements.map((item, index) => <div key={index}><strong>{item.title || 'ประกาศ'}</strong><span>{item.message || 'ข้อความประกาศ'}</span></div>)}</section>""",
          """      <section style={desktopAnnouncementStyle}>{announcements.map((item, index) => { const image = assetUrl(content.assets, item.desktopAssetId ?? item.assetId) || item.desktopImageUrl || item.imageUrl || ''; return <div key={index}>{image && isAssetUrl(image) && <img src={resolveAssetUrl(image)} alt=\"\" style={assetPreviewStyle} />}<small>{item.kind ?? 'system'}</small><strong>{item.title || 'ประกาศ'}</strong><span>{item.message || 'ข้อความประกาศ'}</span></div>; })}</section>""")
          replace(page,
          """  content.banners.forEach((banner, index) => { if (banner.assetId === assetId) usage.push(`Banner ${index + 1}`); });
            if (content.popup.assetId === assetId) usage.push('Popup');""",
          """  content.banners.forEach((banner, index) => { if ([banner.assetId, banner.desktopAssetId, banner.mobileAssetId].includes(assetId)) usage.push(`Banner ${index + 1}`); });
            content.announcements.forEach((announcement, index) => { if ([announcement.assetId, announcement.desktopAssetId, announcement.mobileAssetId].includes(assetId)) usage.push(`ประกาศ ${index + 1}`); });
            if (content.popup.assetId === assetId) usage.push('Popup');""")
          replace(page,
          """  const bannerBroken = content.banners.filter((item) => item.imageUrl && !isAssetUrl(item.imageUrl)).length;
            const assetBroken = content.assets.filter((item) => item.url && !isAssetUrl(item.url)).length;
            const popupBroken = content.popup.imageUrl && !isAssetUrl(content.popup.imageUrl) ? 1 : 0;
            return bannerBroken + assetBroken + popupBroken;""",
          """  const bannerBroken = content.banners.filter((item) => [item.imageUrl, item.desktopImageUrl, item.mobileImageUrl].some((value) => value && !isAssetUrl(value))).length;
            const announcementBroken = content.announcements.filter((item) => [item.imageUrl, item.desktopImageUrl, item.mobileImageUrl].some((value) => value && !isAssetUrl(value))).length;
            const assetBroken = content.assets.filter((item) => item.url && !isAssetUrl(item.url)).length;
            const popupBroken = content.popup.imageUrl && !isAssetUrl(content.popup.imageUrl) ? 1 : 0;
            return bannerBroken + announcementBroken + assetBroken + popupBroken;""")

          promotions = 'apps/web-admin/src/features/cms/promotion-center-page.tsx'
          replace(promotions,
          """  imageUrl?: string | undefined;
            iconUrl?: string | undefined;""",
          """  imageUrl?: string | undefined;
            desktopImageUrl?: string | undefined;
            mobileImageUrl?: string | undefined;
            desktopAssetId?: string | undefined;
            mobileAssetId?: string | undefined;
            iconUrl?: string | undefined;""")
          replace(promotions,
          """  imageUrl: '',
            iconUrl: '',""",
          """  imageUrl: '',
            desktopImageUrl: '',
            mobileImageUrl: '',
            desktopAssetId: '',
            mobileAssetId: '',
            iconUrl: '',""", 1)
          replace(promotions,
          """  const imageWarning = item.imageUrl && !isValidUrl(item.imageUrl) ? 'URL รูปไม่ถูกต้อง' : undefined;""",
          """  const desktopImage = item.desktopImageUrl ?? item.imageUrl ?? '';
            const mobileImage = item.mobileImageUrl ?? item.imageUrl ?? item.desktopImageUrl ?? '';
            const imageWarning = desktopImage && !isValidUrl(desktopImage) ? 'URL รูป Desktop ไม่ถูกต้อง' : undefined;
            const mobileImageWarning = mobileImage && !isValidUrl(mobileImage) ? 'URL รูป Mobile ไม่ถูกต้อง' : undefined;""")
          replace(promotions,
          """        <Field label=\"รูปโปรโมชัน URL\" value={item.imageUrl ?? ''} onChange={(value) => onPatch({ imageUrl: value })} warning={imageWarning} />
                  <Field label=\"ไอคอน URL\" value={item.iconUrl ?? ''} onChange={(value) => onPatch({ iconUrl: value })} warning={iconWarning} />""",
          """        <Field label=\"รูป Desktop URL\" value={desktopImage} onChange={(value) => onPatch({ imageUrl: value, desktopImageUrl: value, desktopAssetId: '' })} warning={imageWarning} />
                  <Field label=\"รูป Mobile URL\" value={mobileImage} onChange={(value) => onPatch({ mobileImageUrl: value, mobileAssetId: '' })} warning={mobileImageWarning} />
                  <Field label=\"Desktop Asset ID\" value={item.desktopAssetId ?? ''} onChange={(value) => onPatch({ desktopAssetId: value })} />
                  <Field label=\"Mobile Asset ID\" value={item.mobileAssetId ?? ''} onChange={(value) => onPatch({ mobileAssetId: value })} />
                  <Field label=\"ไอคอน URL\" value={item.iconUrl ?? ''} onChange={(value) => onPatch({ iconUrl: value })} warning={iconWarning} />""")
          replace(promotions,
          """      {item.imageUrl && isValidUrl(item.imageUrl) && <img src={item.imageUrl} alt=\"\" style={mediaPreviewStyle} />}""",
          """      {desktopImage && isValidUrl(desktopImage) && <picture><source media=\"(max-width: 640px)\" srcSet={mobileImage && isValidUrl(mobileImage) ? mobileImage : desktopImage} /><img src={desktopImage} alt=\"\" style={mediaPreviewStyle} /></picture>}""")
          replace(promotions,
          """        {item.imageUrl && isValidUrl(item.imageUrl)
                    ? <img src={item.imageUrl} alt=\"\" style={previewImageStyle} />""",
          """        {(item.desktopImageUrl ?? item.imageUrl) && isValidUrl(item.desktopImageUrl ?? item.imageUrl ?? '')
                    ? <picture><source media=\"(max-width: 640px)\" srcSet={item.mobileImageUrl && isValidUrl(item.mobileImageUrl) ? item.mobileImageUrl : item.desktopImageUrl ?? item.imageUrl} /><img src={item.desktopImageUrl ?? item.imageUrl} alt=\"\" style={previewImageStyle} /></picture>""")
          replace(promotions,
          """      imageUrl: String(item.imageUrl ?? ''),
              iconUrl: String(item.iconUrl ?? ''),""",
          """      imageUrl: String(item.imageUrl ?? item.desktopImageUrl ?? ''),
              desktopImageUrl: String(item.desktopImageUrl ?? item.imageUrl ?? ''),
              mobileImageUrl: String(item.mobileImageUrl ?? item.imageUrl ?? item.desktopImageUrl ?? ''),
              desktopAssetId: String(item.desktopAssetId ?? ''),
              mobileAssetId: String(item.mobileAssetId ?? ''),
              iconUrl: String(item.iconUrl ?? ''),""")
          replace(promotions,
          """    imageUrl: '',
              iconUrl: '',""",
          """    imageUrl: '',
              desktopImageUrl: '',
              mobileImageUrl: '',
              desktopAssetId: '',
              mobileAssetId: '',
              iconUrl: '',""", 1)
          replace(promotions,
          """    if (item.lifecycle === 'published' && item.turnoverMultiplier <= 0) warnings.push(`โปรที่เผยแพร่ต้องมีเทิร์นมากกว่า 0: ${item.title || item.id}`);""",
          """    if (item.lifecycle === 'published' && item.turnoverMultiplier <= 0) warnings.push(`โปรที่เผยแพร่ต้องมีเทิร์นมากกว่า 0: ${item.title || item.id}`);
              if (item.desktopImageUrl && !isValidUrl(item.desktopImageUrl)) warnings.push(`URL รูป Desktop ไม่ถูกต้อง: ${item.title || item.id}`);
              if (item.mobileImageUrl && !isValidUrl(item.mobileImageUrl)) warnings.push(`URL รูป Mobile ไม่ถูกต้อง: ${item.title || item.id}`);""")

          query = 'apps/api/src/modules/promotions/promotions-query.service.ts'
          replace(query,
          """      claimMode: item.claimMode === 'auto_pending' ? 'auto_pending' : 'manual_review', startsAt: typeof item.startsAt === 'string' ? item.startsAt : undefined,
              endsAt: typeof item.endsAt === 'string' ? item.endsAt : undefined,""",
          """      claimMode: item.claimMode === 'auto_pending' ? 'auto_pending' : 'manual_review',
              imageUrl: typeof item.imageUrl === 'string' ? item.imageUrl : typeof item.desktopImageUrl === 'string' ? item.desktopImageUrl : '',
              desktopImageUrl: typeof item.desktopImageUrl === 'string' ? item.desktopImageUrl : typeof item.imageUrl === 'string' ? item.imageUrl : '',
              mobileImageUrl: typeof item.mobileImageUrl === 'string' ? item.mobileImageUrl : typeof item.imageUrl === 'string' ? item.imageUrl : typeof item.desktopImageUrl === 'string' ? item.desktopImageUrl : '',
              desktopAssetId: typeof item.desktopAssetId === 'string' ? item.desktopAssetId : '',
              mobileAssetId: typeof item.mobileAssetId === 'string' ? item.mobileAssetId : '',
              iconUrl: typeof item.iconUrl === 'string' ? item.iconUrl : '',
              badgeText: typeof item.badgeText === 'string' ? item.badgeText : '',
              accentColor: typeof item.accentColor === 'string' ? item.accentColor : '',
              priority: Number(item.priority ?? 0), startsAt: typeof item.startsAt === 'string' ? item.startsAt : undefined,
              endsAt: typeof item.endsAt === 'string' ? item.endsAt : undefined,""")

          test = Path('apps/web-admin/src/features/cms/media-responsive-contract.spec.ts')
          test.write_text("""import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import test from 'node:test';
          import { normalizeContent } from './content-center-contract';

          test('normalizes desktop and mobile media variants without dropping legacy imageUrl', () => {
            const content = normalizeContent({
              banners: [{ title: 'A', subtitle: '', imageUrl: '/legacy.png', mobileImageUrl: '/mobile.png', href: '/', enabled: true }],
              announcements: [{ title: 'News', message: 'Body', kind: 'news', desktopImageUrl: '/news.png', mobileImageUrl: '/news-mobile.png', href: '/news', enabled: true }],
            });
            assert.equal(content.banners[0]?.desktopImageUrl, '/legacy.png');
            assert.equal(content.banners[0]?.mobileImageUrl, '/mobile.png');
            assert.equal(content.announcements[0]?.kind, 'news');
            assert.equal(content.announcements[0]?.mobileImageUrl, '/news-mobile.png');
          });

          test('Admin editors expose responsive image and asset controls', () => {
            const cms = readFileSync(new URL('./content-center-page.tsx', import.meta.url), 'utf8');
            const promotions = readFileSync(new URL('./promotion-center-page.tsx', import.meta.url), 'utf8');
            assert.match(cms, /Asset สำหรับ Desktop/);
            assert.match(cms, /Asset สำหรับ Mobile/);
            assert.match(cms, /ประเภทเนื้อหา/);
            assert.match(promotions, /รูป Desktop URL/);
            assert.match(promotions, /รูป Mobile URL/);
            assert.match(promotions, /<picture>/);
          });
          """)

          api_test = Path('apps/api/src/modules/promotions/promotions-media.spec.ts')
          api_test.write_text("""import { PromotionsQueryService } from './promotions-query.service';

          describe('promotion media contract', () => {
            it('returns responsive promotion media variants from public campaigns', async () => {
              const prisma = {
                siteSetting: { findUnique: jest.fn().mockResolvedValue({ valueJson: [{ id: 'welcome', title: 'Welcome', enabled: true, imageUrl: '/desktop.jpg', mobileImageUrl: '/mobile.jpg', desktopAssetId: 'asset-desktop', mobileAssetId: 'asset-mobile' }] }) },
              } as any;
              const service = new PromotionsQueryService(prisma);
              const result = await service.listPublicCampaigns();
              expect(result.items[0]).toEqual(expect.objectContaining({ imageUrl: '/desktop.jpg', desktopImageUrl: '/desktop.jpg', mobileImageUrl: '/mobile.jpg', desktopAssetId: 'asset-desktop', mobileAssetId: 'asset-mobile' }));
            });
          });
          """)
          PY
      - run: pnpm install --frozen-lockfile=false
      - name: Admin tests
        run: pnpm --filter @platform/web-admin test
      - name: Admin typecheck
        run: pnpm --filter @platform/web-admin typecheck
      - name: Admin build
        run: pnpm --filter @platform/web-admin build
      - name: Promotion API tests
        run: pnpm --filter @platform/api test -- promotions-media.spec.ts --runInBand
      - name: API typecheck
        run: pnpm --filter @platform/api typecheck
      - name: API build
        run: pnpm --filter @platform/api build
      - name: Commit final product changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/admin-media-promotion-finalize.yml
          git add apps/web-admin/src/features/cms apps/api/src/modules/promotions
          git commit -m 'feat(cms): add responsive promotion and content media'
          git push origin HEAD:feat/admin-media-promotion-system
