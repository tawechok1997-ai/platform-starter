name: Windows One-Click Smoke

on:
  pull_request:
    paths:
      - '.env.example'
      - '.gitignore'
      - 'Setup-Windows.cmd'
      - 'Start-Windows.cmd'
      - 'Stop-Windows.cmd'
      - 'Verify-Windows.cmd'
      - 'compose.windows.yml'
      - 'docs/windows-one-click.md'
      - 'scripts/windows/**'
      - 'tools/windows-one-click-contract.test.mjs'
      - 'tools/windows-one-click-integration-contract.test.mjs'
      - 'tools/windows-one-click-integration-smoke.ps1'
      - 'tools/windows-one-click-smoke-launch-service.ps1'
      - 'tools/windows-one-click-smoke-service.mjs'
      - '.github/workflows/windows-one-click-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-one-click-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-smoke:
    name: PowerShell and launcher contracts
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run one-click contract tests
        shell: pwsh
        run: >-
          node --test
          tools/windows-one-click-contract.test.mjs
          tools/windows-one-click-integration-contract.test.mjs

      - name: Parse Windows PowerShell owners
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -LiteralPath scripts\windows -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null

            foreach ($parseError in @($parseErrors)) {
              Write-Error ("{0}:{1}:{2} {3}" -f $_.FullName, $parseError.Extent.StartLineNumber, $parseError.Extent.StartColumnNumber, $parseError.Message)
              $failed = $true
            }
          }

          if ($failed) {
            throw 'One or more Windows PowerShell scripts failed to parse.'
          }

      - name: Verify root command wrappers
        shell: cmd
        run: |
          findstr /C:"scripts\windows\setup.ps1" Setup-Windows.cmd
          findstr /C:"scripts\windows\start.ps1" Start-Windows.cmd
          findstr /C:"scripts\windows\stop.ps1" Stop-Windows.cmd
          findstr /C:"scripts\windows\verify.ps1" Verify-Windows.cmd

      - name: Run native launcher lifecycle integration smoke
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File tools\windows-one-click-integration-smoke.ps1

      - name: Run verifier evidence smoke
        shell: powershell
        run: |
          $environmentPath = Join-Path $PWD '.env.windows.local'
          $evidencePath = Join-Path $PWD '.local\evidence\windows-clean-machine-verification.json'
          $environment = @'
          NODE_ENV=development
          WINDOWS_POSTGRES_PASSWORD=ci-smoke-secret-postgres
          DATABASE_URL=postgresql://platform:ci-smoke-secret-db@127.0.0.1:1/platform?schema=public&connect_timeout=1
          REDIS_URL=redis://127.0.0.1:1
          BOOTSTRAP_ADMIN_USERNAME=ci-smoke-admin
          BOOTSTRAP_ADMIN_EMAIL=ci-smoke@example.invalid
          BOOTSTRAP_ADMIN_PASSWORD=ci-smoke-secret-admin
          JWT_ACCESS_KEY=ci-smoke-secret-jwt
          TWO_FACTOR_ENCRYPTION_KEY=ci-smoke-secret-two-factor
          GAME_CREDENTIAL_SECRET=ci-smoke-secret-game
          ANTIBOT_ENCRYPTION_KEY=ci-smoke-secret-antibot
          '@
          $encoding = New-Object System.Text.UTF8Encoding($false)
          [IO.File]::WriteAllText($environmentPath, $environment.TrimStart(), $encoding)

          try {
            & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File scripts\windows\verify.ps1
            $verifierExit = $LASTEXITCODE

            if (-not (Test-Path -LiteralPath $evidencePath)) {
              throw 'Verifier did not create the evidence report.'
            }

            $raw = Get-Content -LiteralPath $evidencePath -Raw
            $report = $raw | ConvertFrom-Json
            if ([int]$report.schemaVersion -ne 1) {
              throw 'Verifier evidence schema version is invalid.'
            }
            if ([int]$report.summary.total -lt 20) {
              throw "Verifier evidence contains too few checks: $($report.summary.total)."
            }
            if ($raw -match 'ci-smoke-secret-') {
              throw 'Verifier evidence leaked an environment secret value.'
            }
            if ($null -eq $report.summary.success) {
              throw 'Verifier evidence summary is missing the success flag.'
            }

            Write-Host "Verifier evidence smoke passed with child exit code $verifierExit."
          } finally {
            Remove-Item -LiteralPath $environmentPath -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $evidencePath -Force -ErrorAction SilentlyContinue
          }

          exit 0
