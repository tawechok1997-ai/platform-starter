name: Admin Authenticated UI Smoke

on:
  workflow_dispatch:
    inputs:
      admin_url:
        description: Deployed Admin web URL
        required: false
        type: string
      api_url:
        description: Deployed API URL used for health and commit identity
        required: false
        type: string
      expected_commit:
        description: Expected deployed Git commit (defaults to the dispatched commit)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: admin-authenticated-ui-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admin-ui-smoke:
    name: Admin Desktop and Mobile Route Audit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ADMIN_WEB_URL: ${{ inputs.admin_url || vars.P6_ADMIN_URL || secrets.SEED_ADMIN_WEB_URL || 'https://platformweb-admin-production.up.railway.app' }}
      API_PUBLIC_URL: ${{ inputs.api_url || vars.P6_API_URL || secrets.SEED_API_URL || 'https://platformapi-production-3c91.up.railway.app' }}
      EXPECTED_DEPLOY_COMMIT: ${{ inputs.expected_commit || github.sha }}
      SEED_ADMIN_USERNAME: ${{ secrets.SEED_ADMIN_USERNAME || secrets.P6_ADMIN_USERNAME }}
      SEED_ADMIN_EMAIL: ${{ secrets.SEED_ADMIN_EMAIL || secrets.P6_ADMIN_EMAIL }}
      SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD || secrets.P6_ADMIN_PASSWORD }}
      PROD_SMOKE_ALLOWED_HOSTS: ${{ vars.PROD_SMOKE_ALLOWED_HOSTS }}
      REQUIRE_ADMIN_AUTHENTICATED_SMOKE: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Admin UI smoke environment
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const targets = [
            ['ADMIN_WEB_URL', process.env.ADMIN_WEB_URL],
            ['API_PUBLIC_URL', process.env.API_PUBLIC_URL],
          ];
          const allowList = new Set(
            String(process.env.PROD_SMOKE_ALLOWED_HOSTS ?? '')
              .split(',')
              .map((value) => value.trim().toLowerCase())
              .filter(Boolean),
          );

          for (const [name, rawValue] of targets) {
            const raw = String(rawValue ?? '').trim();
            if (!raw) throw new Error(`${name} is required`);
            const url = new URL(raw);
            const local = ['localhost', '127.0.0.1', '::1'].includes(url.hostname);
            if (url.protocol !== 'https:' && !(local && url.protocol === 'http:')) {
              throw new Error(`${name} must use HTTPS except for localhost`);
            }
            if (url.username || url.password) throw new Error(`${name} must not embed credentials`);
            if (url.hash) throw new Error(`${name} must not contain a fragment`);
            if (allowList.size > 0 && !allowList.has(url.hostname.toLowerCase())) {
              throw new Error(`${name} host is not allow-listed`);
            }
          }

          const expectedCommit = String(process.env.EXPECTED_DEPLOY_COMMIT ?? '').trim();
          if (expectedCommit.length < 7 || !/^[a-f0-9]+$/i.test(expectedCommit)) {
            throw new Error('EXPECTED_DEPLOY_COMMIT is missing or malformed');
          }
          const identity = String(process.env.SEED_ADMIN_USERNAME || process.env.SEED_ADMIN_EMAIL || '').trim();
          const password = String(process.env.SEED_ADMIN_PASSWORD || '');
          if (!identity) throw new Error('Seeded Admin identity is required');
          if (password.length < 8) throw new Error('Seeded Admin password is missing or malformed');
          console.log('Validated authenticated Admin UI and API smoke targets');
          NODE

      - name: Verify Production health and commit identity
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const base = new URL(String(process.env.API_PUBLIC_URL));
          const expected = String(process.env.EXPECTED_DEPLOY_COMMIT).trim().toLowerCase();
          async function read(path) {
            const response = await fetch(new URL(path, base), {
              headers: { accept: 'application/json' },
              signal: AbortSignal.timeout(15_000),
            });
            if (!response.ok) throw new Error(`${path} returned ${response.status}`);
            return response.json();
          }
          const [health, version] = await Promise.all([read('/health'), read('/version')]);
          if (health?.status !== 'ok') throw new Error(`Production health reported ${health?.status ?? 'unknown'}`);
          const deployed = String(version?.commit ?? '').trim().toLowerCase();
          if (deployed.length < 7) throw new Error('Production /version did not return a usable commit');
          if (!(deployed === expected || deployed.startsWith(expected) || expected.startsWith(deployed))) {
            throw new Error(`Production commit ${deployed} does not match expected ${expected}`);
          }
          console.log(`Verified Production commit ${deployed}`);
          NODE

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run responsive Admin workspace audit
        run: pnpm exec playwright test -c playwright.authenticated-visual.config.ts --grep "admin authenticated workspace smoke"

      - name: Upload responsive Admin evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-authenticated-ui-${{ github.run_id }}
          path: |
            test-results/authenticated-visual/**
            playwright-report/authenticated-visual/**
          if-no-files-found: error
          retention-days: 14

      - name: Write Admin UI evidence summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Admin responsive workspace audit'
            echo
            echo 'Verifies API health and deployed commit identity before authenticated browser checks.'
            echo
            echo 'Checks every accessible Admin workspace route at desktop and mobile viewports.'
            echo
            echo 'Validates shell controls, profile/logout visibility, route width, horizontal overflow, surface bounds, broken images and runtime errors.'
            echo
            echo 'The browser guard blocks non-read-only requests after authentication.'
            echo
            echo 'Evidence includes screenshots and redacted runtime/layout audit JSON. Credentials are never written to artifacts.'
          } >> "$GITHUB_STEP_SUMMARY"
