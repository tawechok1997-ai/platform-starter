name: Patch Settings PR 265

on:
  push:
    branches:
      - feat/admin-settings-ui-system-v2

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/admin-settings-ui-system-v2
          fetch-depth: 0
      - name: Apply verified settings fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          settings = root / 'apps/web-admin/app/(admin)/settings/settings-section-page.tsx'
          text = settings.read_text()
          replacements = {
              "tone={risk === 'critical' ? 'danger' : 'warning'}": "tone={risk === 'critical' ? 'danger' : 'primary'}",
              "  error?: string;\n  onChange:": "  error: string | undefined;\n  onChange:",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing settings replacement: {old}')
              text = text.replace(old, new, 1)
          settings.write_text(text)

          branding_test = root / 'apps/web-admin/app/(admin)/settings/branding/branding-settings-fields.spec.ts'
          text = branding_test.read_text()
          text = text.replace("\nconst settingsEndpoint = '/admin/settings/website';\n", "\n")
          old = """test('website settings retain Member-facing content keys and the existing API contract', () => {\n  assert.match(websiteSource, /useAdminSettingsForm<WebsiteSettings>/);\n  assert.match(websiteSource, new RegExp(`endpoint:\\\\s*[\"']${settingsEndpoint}[\"']`));\n  assert.match(lifecycleSource, /adminApiFetch\\(endpoint\\)/);\n  assert.match(lifecycleSource, /method:\\s*[\"']PUT[\"']/);\n\n  for (const key of requiredWebsiteKeys) {\n    assert.match(websiteSource, new RegExp(`\\\\b${key}\\\\b`), `${key} must remain editable in Admin website settings`);\n  }\n});"""
          new = """test('website settings retain Member-facing content keys and the shared API contract', () => {\n  assert.match(websiteSource, /SettingsSectionPage/);\n  assert.match(websiteSource, /group=[\"']website[\"']/);\n  assert.match(settingsSectionSource, /endpoint:\\s*`\\/admin\\/settings\\/\\$\\{group\\}`/);\n  assert.match(lifecycleSource, /adminApiFetch\\(endpoint\\)/);\n  assert.match(lifecycleSource, /method:\\s*[\"']PUT[\"']/);\n\n  for (const key of requiredWebsiteKeys) {\n    assert.match(websiteSource, new RegExp(`\\\\b${key}\\\\b`), `${key} must remain editable in Admin website settings`);\n  }\n});"""
          if old not in text:
              raise SystemExit('missing website API contract test block')
          text = text.replace(old, new, 1)
          old = """test('settings pages preserve shared reset and unsaved-change safeguards', () => {\n  assert.match(brandingSource, /SettingsSectionPage/);\n  assert.match(websiteSource, /useAdminSettingsForm/);\n  assert.match(settingsSectionSource, /useAdminSettingsForm<SettingsRecord>/);\n  assert.match(websiteSource, /reset/);\n  assert.match(settingsSectionSource, /onClick={reset}/);\n  assert.match(lifecycleSource, /useAdminUnsavedChanges/);\n  assert.match(unsavedChangesSource, /beforeunload/);\n  assert.match(unsavedChangesSource, /window\\.confirm\\(warningMessage\\)/);\n  assert.match(lifecycleSource, /setForm\\(initialForm\\)/);\n});"""
          new = """test('settings pages preserve shared reset and unsaved-change safeguards', () => {\n  assert.match(brandingSource, /SettingsSectionPage/);\n  assert.match(websiteSource, /SettingsSectionPage/);\n  assert.match(settingsSectionSource, /useAdminSettingsForm<SettingsRecord>/);\n  assert.match(settingsSectionSource, /onClick=\\{reset\\}/);\n  assert.match(lifecycleSource, /useAdminUnsavedChanges/);\n  assert.match(unsavedChangesSource, /beforeunload/);\n  assert.match(unsavedChangesSource, /window\\.confirm\\(warningMessage\\)/);\n  assert.match(lifecycleSource, /setForm\\(initialForm\\)/);\n});"""
          if old not in text:
              raise SystemExit('missing shared safeguards test block')
          text = text.replace(old, new, 1)
          branding_test.write_text(text)

          professional_test = root / 'apps/web-admin/app/(admin)/settings/settings-professional.spec.ts'
          text = professional_test.read_text()
          old = """test('website settings uses grouped fields switches preview and sticky actions', () => {\n  assert.match(websitePage, /SectionLabel title=\"ข้อมูลเว็บไซต์\"/);\n  assert.match(websitePage, /SectionLabel title=\"สถานะระบบ\"/);\n  assert.match(websitePage, /SectionLabel title=\"ข้อความหน้าแรก\"/);\n  assert.match(websitePage, /SectionLabel title=\"เข้าสู่ระบบและการทำรายการ\"/);\n  assert.match(websitePage, /className=\\{styles\\.previewPanel\\}/);\n  assert.match(websitePage, /className=\\{styles\\.actionBar\\}/);\n});"""
          new = """test('website settings delegates grouped sections and sensitive confirmation to the shared system', () => {\n  assert.match(websitePage, /SettingsSectionPage/);\n  assert.match(websitePage, /group=[\"']website[\"']/);\n  assert.match(websitePage, /section:\\s*[\"']ข้อมูลเว็บไซต์[\"']/);\n  assert.match(websitePage, /section:\\s*[\"']สถานะระบบ[\"']/);\n  assert.match(websitePage, /section:\\s*[\"']ข้อความหน้าแรก[\"']/);\n  assert.match(websitePage, /section:\\s*[\"']Login และ Register[\"']/);\n  assert.match(websitePage, /risk=[\"']sensitive[\"']/);\n  assert.match(sharedPage, /className=\\{styles\\.previewPanel\\}/);\n  assert.match(sharedPage, /className=\\{styles\\.actionBar\\}/);\n});"""
          if old not in text:
              raise SystemExit('missing website professional contract test block')
          professional_test.write_text(text.replace(old, new, 1))
          PY

          git rm .github/workflows/patch-settings-pr265.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-admin/app/'(admin)'/settings
          git commit -m "fix(admin): align shared settings contracts"
          git push origin HEAD:feat/admin-settings-ui-system-v2
