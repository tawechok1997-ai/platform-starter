name: Mobile Home Smoke

on:
  pull_request:
    paths:
      - 'apps/web-member/**'
      - 'tests/e2e-visual/r013-mobile-home-production-smoke.spec.ts'
      - 'playwright.visual.config.ts'
      - '.github/workflows/mobile-home-smoke.yml'

jobs:
  mobile-home-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run Mobile Home smoke first
        env:
          MEMBER_HOME_URL: http://127.0.0.1:3101/
        run: >-
          pnpm exec playwright test
          tests/e2e-visual/r013-mobile-home-production-smoke.spec.ts
          -c playwright.visual.config.ts
          --project=390x844
          --retries=0
      - name: Upload Mobile Home evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-home-smoke-evidence
          path: artifacts/r013-visual/**
          if-no-files-found: error
          retention-days: 7
