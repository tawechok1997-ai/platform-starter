name: Apply Member Home Dead Code Fix

on:
  push:
    branches:
      - fix/member-casino-alliance-typecheck

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/member-casino-alliance-typecheck
      - name: Remove exact unused functions and temporary workflows
        shell: python
        run: |
          from pathlib import Path

          source_path = Path('apps/web-member/app/components/member-home/desktop-home-scaffold.tsx')
          source = source_path.read_text(encoding='utf-8')
          obsolete = [
              "function ArchiveFeaturedGames({ message }: { message: string }) { return <div className=\"reference-featured-grid reference-featured-grid--archive\" aria-label={message || 'เกมตัวอย่างจากชุด asset'}><ArchiveGameTile game={ARCHIVE_GAMES[0]!} large /><div className=\"reference-featured-small-grid\" data-drag-scroll=\"true\">{ARCHIVE_GAMES.slice(1, 9).map((game) => <ArchiveGameTile key={game.name} game={game} />)}</div></div>; }\n",
              "function EmptyState({ label }: { label: string }) { return <div className=\"reference-empty\">{label}</div>; }\n",
          ]
          for line in obsolete:
              count = source.count(line)
              if count != 1:
                  raise SystemExit(f'Expected exactly one obsolete function, found {count}: {line[:80]}')
              source = source.replace(line, '')
          source_path.write_text(source, encoding='utf-8')

          for workflow in [
              Path('.github/workflows/debug-member-build-pr246.yml'),
              Path('.github/workflows/apply-member-home-dead-code-fix.yml'),
          ]:
              workflow.unlink(missing_ok=True)
      - name: Commit exact patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web-member/app/components/member-home/desktop-home-scaffold.tsx .github/workflows
          git commit -m "fix(member): remove obsolete home helpers"
          git push origin HEAD:fix/member-casino-alliance-typecheck
