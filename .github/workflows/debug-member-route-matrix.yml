name: Temporary Member Route Matrix Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Print route matrix drift
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const ref = context.payload.pull_request.head.sha;
            const commit = await github.rest.repos.getCommit({ owner, repo, ref });
            const tree = await github.rest.git.getTree({
              owner,
              repo,
              tree_sha: commit.data.commit.tree.sha,
              recursive: 'true',
            });
            const appPrefix = 'apps/web-member/app/';
            const pages = tree.data.tree
              .filter((entry) => entry.type === 'blob' && entry.path?.startsWith(appPrefix) && entry.path.endsWith('/page.tsx'))
              .map((entry) => entry.path)
              .sort();
            const matrixFile = await github.rest.repos.getContent({
              owner,
              repo,
              path: 'docs/MEMBER_ROUTE_MATRIX.md',
              ref,
            });
            const markdown = Buffer.from(matrixFile.data.content, 'base64').toString('utf8');
            const matrixRoutes = new Map(
              markdown.split('\n')
                .filter((line) => /^\|\s*`\//.test(line))
                .map((line) => {
                  const cells = line.split('|').slice(1, -1).map((cell) => cell.trim());
                  return [cells[0].replace(/^`|`$/g, ''), cells[1].replace(/^`|`$/g, '')];
                }),
            );
            const routeFromPage = (path) => {
              const segments = path.slice(appPrefix.length, -'/page.tsx'.length)
                .split('/')
                .filter(Boolean)
                .filter((segment) => !/^\(.+\)$/.test(segment));
              return segments.length ? `/${segments.join('/')}` : '/';
            };
            const errors = [];
            for (const page of pages) {
              const route = routeFromPage(page);
              if (!matrixRoutes.has(route)) errors.push(`${route}: ${page} is missing from the matrix`);
              else if (matrixRoutes.get(route) !== page) errors.push(`${route}: expected ${page}, matrix has ${matrixRoutes.get(route)}`);
            }
            for (const [route, page] of matrixRoutes) {
              if (!pages.includes(page)) errors.push(`${route}: matrix page ${page} does not exist`);
            }
            console.log(`ROUTE_MATRIX_DIAGNOSTIC pages=${pages.length} matrix=${matrixRoutes.size} errors=${errors.length}`);
            for (const error of errors) console.log(`ROUTE_MATRIX_ERROR ${error}`);
            if (errors.length) core.setFailed(`${errors.length} route matrix errors`);
