name: Member Desktop Full Audit

# Production recheck requested 2026-08-05T04:43+07:00

on:
  pull_request:
    paths:
      - 'apps/web-member/**'
      - 'tests/e2e-visual/r013-member-desktop-*-audit.spec.ts'
      - 'playwright.member-desktop-audit.config.ts'
      - '.github/workflows/member-desktop-full-audit.yml'
  workflow_dispatch:

concurrency:
  group: member-desktop-full-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  member-desktop-full-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm exec playwright install --with-deps chromium
      - name: Audit Production Member Desktop
        env:
          MEMBER_HOME_URL: https://platformweb-member-production.up.railway.app/
        run: >-
          pnpm exec playwright test
          tests/e2e-visual/r013-member-desktop-full-audit.spec.ts
          -c playwright.member-desktop-audit.config.ts
          --retries=0
      - name: Upload Member Desktop audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: member-desktop-full-audit-evidence
          path: artifacts/member-desktop-audit/**
          if-no-files-found: error
          retention-days: 14
