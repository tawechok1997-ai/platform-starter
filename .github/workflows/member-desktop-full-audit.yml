name: Member Desktop Full Audit

on:
  pull_request:
    paths:
      - 'apps/web-member/**'
      - 'tests/e2e-visual/r013-member-desktop-*-audit.spec.ts'
      - 'playwright.member-desktop-audit.config.ts'
      - '.github/workflows/member-desktop-full-audit.yml'
  workflow_dispatch:

concurrency:
  group: member-desktop-full-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  member-desktop-full-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MEMBER_HOME_URL: http://127.0.0.1:3000/
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm exec playwright install --with-deps chromium
      - name: Build Member app from the pull request
        run: pnpm --filter @platform/web-member build
      - name: Start Member app from the pull request
        run: |
          pnpm --filter @platform/web-member start > /tmp/member-desktop-web.log 2>&1 &
          echo $! > /tmp/member-desktop-web.pid
          for attempt in {1..60}; do
            if curl --fail --silent --show-error "$MEMBER_HOME_URL" > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/member-desktop-web.log
          exit 1
      - name: Audit Pull Request Member Desktop
        run: >-
          pnpm exec playwright test
          tests/e2e-visual/r013-member-desktop-full-audit.spec.ts
          tests/e2e-visual/r013-member-desktop-theme-audit.spec.ts
          -c playwright.member-desktop-audit.config.ts
          --retries=0
      - name: Upload Member server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: member-desktop-full-audit-server-log
          path: /tmp/member-desktop-web.log
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Member Desktop audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: member-desktop-full-audit-evidence
          path: artifacts/member-desktop-audit/**
          if-no-files-found: error
          retention-days: 14
