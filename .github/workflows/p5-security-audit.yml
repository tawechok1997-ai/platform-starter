name: P5 Security Audit

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p5-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-and-secret-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Refresh patched PostCSS lockfile on the owned feature branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/admin-shell-responsive-layout'
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'postcss: 8.5.23' pnpm-workspace.yaml
          pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'Lockfile is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'chore(lockfile): refresh patched PostCSS override'
          git push origin HEAD:${GITHUB_HEAD_REF}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies and committed secrets
        id: dependency_security
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm audit:dependency-security 2>&1 | tee dependency-security-audit.log

      - name: Upload dependency and secret audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-security-audit-evidence
          path: dependency-security-audit.log
          if-no-files-found: error
          retention-days: 14

      - name: Publish security audit summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Dependency and committed-secret audit'
            echo
            echo '- Outcome: **${{ steps.dependency_security.outcome }}**'
            echo '- Full output: `dependency-security-audit-evidence` artifact'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on dependency or secret audit violations
        if: steps.dependency_security.outcome == 'failure'
        run: exit 1

      - name: Validate environment schema tests
        run: pnpm --filter @platform/api exec jest src/common/config/runtime-env.spec.ts --runInBand
