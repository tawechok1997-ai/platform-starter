name: P5 Security Audit

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p5-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-and-secret-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply bounded PR review fixes
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/admin-shell-responsive-layout'
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          changed = []

          def patch(path_value, replacements):
              path = Path(path_value)
              source = path.read_text(encoding='utf-8')
              original = source
              for old, new in replacements:
                  if old in source:
                      if source.count(old) != 1:
                          raise SystemExit(f'{path}: expected exactly one match for {old[:80]!r}, found {source.count(old)}')
                      source = source.replace(old, new, 1)
                  elif new not in source:
                      raise SystemExit(f'{path}: neither original nor patched marker was found: {old[:100]!r}')
              if source != original:
                  path.write_text(source, encoding='utf-8')
                  changed.append(str(path))

          patch('apps/web-admin/app/(admin)/admin-nav.ts', [
              (
                  "  permissions?: readonly string[];\n  badgeKey?: 'topups' | 'withdrawals' | 'pending';",
                  "  permissions?: readonly string[];\n  permissionTargets?: readonly { href: string; permissions: readonly string[] }[];\n  badgeKey?: 'topups' | 'withdrawals' | 'pending';",
              ),
              (
                  "      { title: 'การเงิน', titleEn: 'Finance', href: '/topups', permissions: ['topups.view', 'deposit.view'], badgeKey: 'pending' },",
                  "      {\n        title: 'การเงิน',\n        titleEn: 'Finance',\n        href: '/topups',\n        permissions: ['topups.view', 'deposit.view', 'withdraw.view', 'wallet.view', 'reports.view', 'reports.export', 'game.providers.view', 'provider.view'],\n        permissionTargets: [\n          { href: '/topups', permissions: ['topups.view', 'deposit.view'] },\n          { href: '/withdrawals', permissions: ['withdraw.view'] },\n          { href: '/wallets', permissions: ['wallet.view'] },\n          { href: '/reports', permissions: ['reports.view'] },\n          { href: '/exports', permissions: ['reports.export'] },\n          { href: '/reconciliation-center', permissions: ['game.providers.view', 'provider.view'] },\n        ],\n        badgeKey: 'pending',\n      },",
              ),
              (
                  "export function canAccessNavItem(item: AdminNavItem, permissions: readonly string[]) {",
                  "export function resolveNavItemHref(item: AdminNavItem, permissions: readonly string[]) {\n  if (!item.permissionTargets?.length || permissions.includes('*')) return item.href;\n  return item.permissionTargets.find((target) => target.permissions.some((permission) => permissions.includes(permission)))?.href ?? item.href;\n}\n\nexport function canAccessPath(pathname: string, permissions: readonly string[]) {\n  const required = requiredPermissionsForPath(pathname);\n  return required.length === 0 || permissions.includes('*') || required.some((permission) => permissions.includes(permission));\n}\n\nexport function canAccessNavItem(item: AdminNavItem, permissions: readonly string[]) {",
              ),
          ])

          patch('apps/web-admin/app/(admin)/layout.tsx', [
              (
                  "import { canAccessNavItem, localizedNavGroupDescription, localizedNavGroupTitle, localizedNavTitle, navGroups, requiredPermissionsForPath } from './admin-nav';",
                  "import { canAccessNavItem, localizedNavGroupDescription, localizedNavGroupTitle, localizedNavTitle, navGroups, requiredPermissionsForPath, resolveNavItemHref } from './admin-nav';",
              ),
              (
                  ".map((item) => ({ ...item, title: localizedNavTitle(item, locale) })),",
                  ".map((item) => ({ ...item, href: resolveNavItemHref(item, permissions), title: localizedNavTitle(item, locale) })),",
              ),
              (
                  ".map((item) => ({ ...item, title: localizedNavTitle(item, locale) }))), [locale, permissions]);",
                  ".map((item) => ({ ...item, href: resolveNavItemHref(item, permissions), title: localizedNavTitle(item, locale) }))), [locale, permissions]);",
              ),
          ])

          patch('apps/web-admin/app/(admin)/admin-nav-modernization.spec.ts', [
              (
                  "import { navGroups, requiredPermissionsForPath } from './admin-nav';",
                  "import { navGroups, requiredPermissionsForPath, resolveNavItemHref } from './admin-nav';",
              ),
              (
                  "test('specialist routes remain searchable without crowding the sidebar', () => {",
                  "test('finance workspace resolves to an accessible landing route', () => {\n  const finance = navGroups.flatMap((group) => group.items).find((item) => item.titleEn === 'Finance');\n  assert.ok(finance);\n  assert.equal(resolveNavItemHref(finance, ['withdraw.view']), '/withdrawals');\n  assert.equal(resolveNavItemHref(finance, ['wallet.view']), '/wallets');\n  assert.equal(resolveNavItemHref(finance, ['reports.view']), '/reports');\n  assert.equal(resolveNavItemHref(finance, ['*']), '/topups');\n});\n\ntest('specialist routes remain searchable without crowding the sidebar', () => {",
              ),
          ])

          patch('apps/web-admin/app/(admin)/admin-roles/page.tsx', [
              (
                  "import { AdminWorkspaceTabs } from '../../../src/features/admin-modernization/workspace-tabs';",
                  "import { AdminWorkspaceTabs } from '../../../src/features/admin-modernization/workspace-tabs';\nimport { canAccessPath } from '../admin-nav';",
              ),
              (
                  "type AccessResponse = { roles: Role[]; permissions: Permission[] };\ntype LoadState = 'loading' | 'ready' | 'error';",
                  "type AccessResponse = { roles: Role[]; permissions: Permission[] };\ntype CurrentAdminResponse = { permissions?: string[] };\ntype LoadState = 'loading' | 'ready' | 'error';",
              ),
              (
                  "  const [data, setData] = useState<AccessResponse>({ roles: [], permissions: [] });\n  const [state, setState] = useState<LoadState>('loading');",
                  "  const [data, setData] = useState<AccessResponse>({ roles: [], permissions: [] });\n  const [currentPermissions, setCurrentPermissions] = useState<string[]>(['admin.access.view']);\n  const [state, setState] = useState<LoadState>('loading');",
              ),
              (
                  "      const response = await adminApiFetch('/admin/access/overview');\n      const payload: unknown = await response.json().catch(() => null);\n      if (!response.ok || !isAccessResponse(payload)) throw new Error('invalid access response');\n      setData(payload);\n      setState('ready');",
                  "      const [response, currentAdminResponse] = await Promise.all([\n        adminApiFetch('/admin/access/overview'),\n        adminApiFetch('/admin/auth/me'),\n      ]);\n      const [payload, currentAdminPayload]: [unknown, unknown] = await Promise.all([\n        response.json().catch(() => null),\n        currentAdminResponse.json().catch(() => null),\n      ]);\n      if (!response.ok || !isAccessResponse(payload)) throw new Error('invalid access response');\n      setData(payload);\n      setCurrentPermissions(currentAdminResponse.ok && isCurrentAdminResponse(currentAdminPayload)\n        ? currentAdminPayload.permissions ?? []\n        : ['admin.access.view']);\n      setState('ready');",
              ),
              (
                  "      tabs={accessTabs(locale, copy.title)}",
                  "      tabs={accessTabs(locale, copy.title).filter((tab) => canAccessPath(tab.href, currentPermissions))}",
              ),
              (
                  "function isAccessResponse(value: unknown): value is AccessResponse {",
                  "function isCurrentAdminResponse(value: unknown): value is CurrentAdminResponse {\n  return isRecord(value)\n    && (value.permissions === undefined\n      || (Array.isArray(value.permissions) && value.permissions.every((permission) => typeof permission === 'string')));\n}\n\nfunction isAccessResponse(value: unknown): value is AccessResponse {",
              ),
          ])

          patch('apps/web-admin/app/admin-modern-governance.spec.ts', [
              (
                  "  assert.equal(rolesSource.includes('read-only'), true);",
                  "  assert.equal(rolesSource.includes('read-only'), true);\n  assert.equal(rolesSource.includes(\"adminApiFetch('/admin/auth/me')\"), true);\n  assert.equal(rolesSource.includes('canAccessPath(tab.href, currentPermissions)'), true);",
              ),
          ])

          patch('apps/web-admin/src/features/admin-modernization/data-table.tsx', [
              (
                  "disabled={currentPage <= 1}",
                  "disabled={loading || currentPage <= 1}",
              ),
              (
                  "            aria-current={token === currentPage ? 'page' : undefined}\n            aria-label={labels.page(token)}",
                  "            disabled={loading}\n            aria-current={token === currentPage ? 'page' : undefined}\n            aria-label={labels.page(token)}",
              ),
              (
                  "disabled={currentPage >= pageCount}",
                  "disabled={loading || currentPage >= pageCount}",
              ),
              (
                  "<select value={pageSize} onChange={(event) => onPageSizeChange(Number(event.target.value))}>",
                  "<select value={pageSize} disabled={loading} onChange={(event) => onPageSizeChange(Number(event.target.value))}>",
              ),
          ])

          data_table_spec = Path('apps/web-admin/src/features/admin-modernization/data-table-loading.spec.ts')
          data_table_spec_content = """import assert from 'node:assert/strict';
import { readFileSync } from 'node:fs';
import test from 'node:test';

const source = readFileSync(new URL('./data-table.tsx', import.meta.url), 'utf8');

test('pagination and page-size controls stay disabled while table data is loading', () => {
  assert.equal(source.includes('disabled={loading || currentPage <= 1}'), true);
  assert.equal(source.includes('disabled={loading || currentPage >= pageCount}'), true);
  assert.equal(source.includes('disabled={loading}\\n            aria-current='), true);
  assert.equal(source.includes('<select value={pageSize} disabled={loading}'), true);
});
"""
          if not data_table_spec.exists() or data_table_spec.read_text(encoding='utf-8') != data_table_spec_content:
              data_table_spec.write_text(data_table_spec_content, encoding='utf-8')
              changed.append(str(data_table_spec))

          patch('apps/web-admin/tools/audit-admin-routes.mjs', [
              (
                  "import process from 'node:process';",
                  "import process from 'node:process';\n\nimport { ADMIN_WORKSPACES } from '../src/features/admin-modernization/workspaces.ts';",
              ),
              (
                  "const WORKSPACE_PREFIXES = [\n  ['authentication', ['/', '/login', '/two-factor', '/accept-invitation']],\n  ['command-center', ['/dashboard', '/operations', '/activity-center', '/activity']],\n  ['finance', [\n    '/finance', '/topups', '/withdrawals', '/bulk-queue-operations', '/wallets', '/wallet-ledgers',\n    '/wallet-statement', '/wallet-analytics', '/reconciliation-center', '/reports', '/exports',\n    '/ledgers', '/money-ops',\n  ]],\n  ['members', ['/members', '/member-detail', '/member-insights', '/bank-accounts', '/kyc', '/kyc-center', '/support-center']],\n  ['risk-compliance', ['/risk-alerts', '/risk-operations', '/provider-risk', '/audit-risk', '/investigation', '/blacklist', '/watchlist', '/aml']],\n  ['provider-operations', [\n    '/provider-health', '/simple-game-settings', '/provider-setup-wizard', '/provider-presets',\n    '/game-providers', '/provider-credentials', '/provider-adapters', '/provider-wallet-snapshots',\n    '/webhook-logs', '/webhook-settlement', '/webhook-test', '/adapter-test', '/game-api-settings',\n  ]],\n  ['games', ['/games', '/game-sessions', '/game-transfers']],\n  ['growth-promotions', ['/growth-center', '/promotion-operations', '/promotion-center', '/promotion-claims', '/bonus-ledgers']],\n  ['affiliate-commission', ['/affiliate-center', '/commission-ledgers']],\n  ['content', ['/content-center']],\n  ['access-security', [\n    '/access', '/admin-accounts', '/admin-roles', '/admin-invitations', '/audit', '/audit-logs',\n    '/security', '/anti-bot', '/profile',\n  ]],\n  ['settings', ['/settings']],\n];",
                  "const WORKSPACE_PREFIXES = [\n  ['authentication', ['/', '/login', '/two-factor', '/accept-invitation']],\n  ...ADMIN_WORKSPACES.map((workspace) => [workspace.id, workspace.legacyPrefixes]),\n];",
              ),
          ])

          patch('apps/web-admin/package.json', [
              (
                  '"inventory:admin-routes": "node tools/audit-admin-routes.mjs"',
                  '"inventory:admin-routes": "node --import tsx tools/audit-admin-routes.mjs"',
              ),
          ])

          patch('apps/web-admin/src/features/admin-modernization/route-ownership.spec.ts', [
              (
                  "import { promises as fs } from 'node:fs';",
                  "import { promises as fs, readFileSync } from 'node:fs';",
              ),
              (
                  "const AUTHENTICATION_ROUTES = new Set(['/', '/login', '/two-factor', '/accept-invitation']);",
                  "const AUTHENTICATION_ROUTES = new Set(['/', '/login', '/two-factor', '/accept-invitation']);\nconst auditSource = readFileSync(new URL('../../../tools/audit-admin-routes.mjs', import.meta.url), 'utf8');",
              ),
              (
                  "test('every Admin route belongs to a workspace or the authentication surface', async () => {",
                  "test('route inventory imports the canonical workspace registry', () => {\n  assert.equal(auditSource.includes(\"import { ADMIN_WORKSPACES } from '../src/features/admin-modernization/workspaces.ts'\"), true);\n  assert.equal(auditSource.includes('...ADMIN_WORKSPACES.map((workspace)'), true);\n  assert.equal(auditSource.includes(\"['members', ['/members'\"), false);\n});\n\ntest('every Admin route belongs to a workspace or the authentication surface', async () => {",
              ),
          ])

          patch('tests/authenticated-visual/admin-authenticated-workspace.spec.ts', [
              (
                  "function installMutationGuard(page: Page) {\n  return page.route('**/*', async (route) => {\n    const request = route.request();\n    if (!['GET', 'HEAD', 'OPTIONS'].includes(request.method())) {\n      throw new Error(`Authenticated Admin workspace smoke must remain read-only: ${request.method()} ${request.url()}`);\n    }\n    await route.continue();\n  });\n}",
                  "function installMutationGuard(page: Page) {\n  return page.route('**/*', async (route) => {\n    const request = route.request();\n    if (!['GET', 'HEAD', 'OPTIONS'].includes(request.method())) {\n      throw new Error(`Authenticated Admin workspace smoke must remain read-only: ${request.method()} ${request.url()}`);\n    }\n    await route.continue();\n  });\n}\n\nasync function revokeAdminSession(page: Page) {\n  if (!adminUrl) return;\n  const token = await page.evaluate(() => window.sessionStorage.getItem('admin_access_token')).catch(() => null);\n  if (!token) return;\n  const response = await page.context().request.post(new URL('/api/admin/auth/logout', adminUrl).toString(), {\n    headers: { Authorization: `Bearer ${token}` },\n  });\n  if (!response.ok()) throw new Error(`Admin smoke logout cleanup failed with ${response.status()}`);\n}\n\ntest.afterEach(async ({ page }) => {\n  await revokeAdminSession(page);\n});",
              ),
          ])

          patch('tools/admin-authenticated-ui-workflow.test.mjs', [
              (
                  "  assert.match(spec, /accessibleRoutes\\.length\\)\\.toBeLessThanOrEqual\\(11\\)/);",
                  "  assert.match(spec, /accessibleRoutes\\.length\\)\\.toBeLessThanOrEqual\\(11\\)/);\n  assert.match(spec, /test\\.afterEach/);\n  assert.match(spec, /api\\/admin\\/auth\\/logout/);\n  assert.match(spec, /Admin smoke logout cleanup failed/);",
              ),
          ])

          patch('tools/audit-architecture-boundaries.mjs', [
              (
                  "import { dirname, extname, join, relative, resolve, sep } from 'node:path';",
                  "import { dirname, extname, join, relative, resolve, sep } from 'node:path';\nimport ts from 'typescript';",
              ),
              (
                  "function importsOf(source) {\n  const imports = [];\n  const pattern = /(?:import|export)\\s+(?:type\\s+)?(?:[^'\";]+?\\s+from\\s+)?['\"]([^'\"]+)['\"]/g;\n  let match;\n  while ((match = pattern.exec(source))) imports.push(match[1]);\n  return imports;\n}",
                  "function importsOf(source, file) {\n  const imports = [];\n  const scriptKind = file.endsWith('.tsx') ? ts.ScriptKind.TSX : ts.ScriptKind.TS;\n  const sourceFile = ts.createSourceFile(file, source, ts.ScriptTarget.Latest, true, scriptKind);\n  function visit(node) {\n    if ((ts.isImportDeclaration(node) || ts.isExportDeclaration(node))\n      && node.moduleSpecifier\n      && ts.isStringLiteral(node.moduleSpecifier)) {\n      imports.push(node.moduleSpecifier.text);\n    } else if (ts.isImportEqualsDeclaration(node)\n      && ts.isExternalModuleReference(node.moduleReference)\n      && node.moduleReference.expression\n      && ts.isStringLiteral(node.moduleReference.expression)) {\n      imports.push(node.moduleReference.expression.text);\n    } else if (ts.isCallExpression(node)\n      && node.expression.kind === ts.SyntaxKind.ImportKeyword\n      && node.arguments[0]\n      && ts.isStringLiteral(node.arguments[0])) {\n      imports.push(node.arguments[0].text);\n    }\n    ts.forEachChild(node, visit);\n  }\n  visit(sourceFile);\n  return imports;\n}",
              ),
              (
                  "for (const specifier of importsOf(source)) {",
                  "for (const specifier of importsOf(source, file)) {",
              ),
              (
                  "  for (const file of await walk(appRoot)) {\n    if (isTestFile(file)) continue;\n    const source = await readFile(file, 'utf8');\n    for (const specifier of importsOf(source, file)) {",
                  "  for (const file of await walk(appRoot)) {\n    const source = await readFile(file, 'utf8');\n    for (const specifier of importsOf(source, file)) {",
              ),
          ])

          patch('apps/web-admin/src/features/admin-modernization/workspace-tabs.tsx', [
              (
                  "    <div className={styles.scroller} role=\"tablist\" aria-orientation=\"horizontal\">",
                  "    <div className={styles.scroller}>",
              ),
              (
                  "          role=\"tab\"\n          aria-selected={active}\n          aria-current={active ? 'page' : undefined}",
                  "          aria-current={active ? 'page' : undefined}",
              ),
          ])

          patch('apps/web-admin/src/features/admin-modernization/workspace-tabs.spec.ts', [
              (
                  "import assert from 'node:assert/strict';\nimport test from 'node:test';",
                  "import assert from 'node:assert/strict';\nimport { readFileSync } from 'node:fs';\nimport test from 'node:test';",
              ),
              (
                  "import { buildWorkspaceTabHref } from './workspace-tab-url';",
                  "import { buildWorkspaceTabHref } from './workspace-tab-url';\n\nconst componentSource = readFileSync(new URL('./workspace-tabs.tsx', import.meta.url), 'utf8');",
              ),
              (
                  "test('workspace tab links preserve unrelated query context', () => {",
                  "test('cross-route workspace navigation keeps native link semantics', () => {\n  assert.equal(componentSource.includes('role=\"tablist\"'), false);\n  assert.equal(componentSource.includes('role=\"tab\"'), false);\n  assert.equal(componentSource.includes('aria-selected='), false);\n  assert.equal(componentSource.includes(\"aria-current={active ? 'page' : undefined}\"), true);\n});\n\ntest('workspace tab links preserve unrelated query context', () => {",
              ),
          ])

          print('Patched files:')
          for item in changed:
              print(f'- {item}')
          PY

          if git diff --quiet; then
            echo 'Review fixes are already applied.'
            exit 0
          fi

          pnpm --filter @platform/web-admin lint
          pnpm --filter @platform/web-admin test
          pnpm --filter @platform/web-admin typecheck
          pnpm --filter @platform/web-admin inventory:admin-routes
          node tools/audit-architecture-boundaries.mjs
          node --test tools/admin-authenticated-ui-workflow.test.mjs

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/web-admin/app/(admin)/admin-nav.ts \
            apps/web-admin/app/(admin)/layout.tsx \
            apps/web-admin/app/(admin)/admin-nav-modernization.spec.ts \
            apps/web-admin/app/(admin)/admin-roles/page.tsx \
            apps/web-admin/app/admin-modern-governance.spec.ts \
            apps/web-admin/src/features/admin-modernization/data-table.tsx \
            apps/web-admin/src/features/admin-modernization/data-table-loading.spec.ts \
            apps/web-admin/tools/audit-admin-routes.mjs \
            apps/web-admin/package.json \
            apps/web-admin/src/features/admin-modernization/route-ownership.spec.ts \
            tests/authenticated-visual/admin-authenticated-workspace.spec.ts \
            tools/admin-authenticated-ui-workflow.test.mjs \
            tools/audit-architecture-boundaries.mjs \
            apps/web-admin/src/features/admin-modernization/workspace-tabs.tsx \
            apps/web-admin/src/features/admin-modernization/workspace-tabs.spec.ts
          git commit -m 'fix(admin): address PR review safety feedback'
          git push origin HEAD:${GITHUB_HEAD_REF}

      - name: Audit production dependencies and committed secrets
        id: dependency_security
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm audit:dependency-security 2>&1 | tee dependency-security-audit.log

      - name: Upload dependency and secret audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-security-audit-evidence
          path: dependency-security-audit.log
          if-no-files-found: error
          retention-days: 14

      - name: Publish security audit summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Dependency and committed-secret audit'
            echo
            echo '- Outcome: **${{ steps.dependency_security.outcome }}**'
            echo '- Full output: `dependency-security-audit-evidence` artifact'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on dependency or secret audit violations
        if: steps.dependency_security.outcome == 'failure'
        run: exit 1

      - name: Validate environment schema tests
        run: pnpm --filter @platform/api exec jest src/common/config/runtime-env.spec.ts --runInBand
