name: Diagnose Admin Media PR 240

on:
  push:
    branches:
      - feat/admin-settings-media-system-v2

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - name: Capture targeted diagnostics
        shell: bash
        run: |
          set +e
          pnpm typecheck:admin > admin-typecheck.log 2>&1
          echo $? > admin-typecheck.exit
          pnpm --filter @platform/web-member test > member-tests.log 2>&1
          echo $? > member-tests.exit
          pnpm --filter @platform/web-member typecheck > member-typecheck.log 2>&1
          echo $? > member-typecheck.exit
          pnpm audit:admin-ui-primitives:strict > admin-ui-primitives.log 2>&1
          echo $? > admin-ui-primitives.exit
          pnpm audit:shared-api-client > shared-api-client.log 2>&1
          echo $? > shared-api-client.exit
          pnpm audit:member-route-matrix > member-route-matrix.log 2>&1
          echo $? > member-route-matrix.exit
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: admin-media-pr240-diagnostics
          path: |
            *.log
            *.exit
          if-no-files-found: error
          retention-days: 3
