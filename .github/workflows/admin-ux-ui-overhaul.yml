name: Admin UX UI Overhaul Gate

on:
  push:
    branches:
      - agent/admin-ux-ui-overhaul
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/admin-ux-ui-overhaul.yml
      - .github/scripts/apply-admin-ux-ui-overhaul.py
      - .github/scripts/patch-admin-overhaul-typecheck.py
      - .github/scripts/patch-admin-overhaul-tests.py

permissions:
  contents: write

concurrency:
  group: admin-ux-ui-overhaul-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  overhaul:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout overhaul branch
        uses: actions/checkout@v4
        with:
          ref: agent/admin-ux-ui-overhaul
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Port approved dashboard and apply UX overhaul
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/admin-dashboard-ux-density
          git checkout origin/fix/admin-dashboard-ux-density -- \
            "apps/web-admin/app/(admin)/dashboard/dashboard-redesigned.module.css" \
            "apps/web-admin/app/(admin)/dashboard/dashboard-redesigned.tsx" \
            "apps/web-admin/app/(admin)/dashboard/page.tsx"
          python .github/scripts/apply-admin-ux-ui-overhaul.py
          python .github/scripts/patch-admin-overhaul-typecheck.py
          python .github/scripts/patch-admin-overhaul-tests.py

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Admin typecheck
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @platform/web-admin typecheck 2>&1 | tee admin-typecheck.log

      - name: Upload typecheck diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-ux-overhaul-typecheck
          path: admin-typecheck.log
          if-no-files-found: error
          retention-days: 7

      - name: Stop on typecheck failure
        if: steps.typecheck.outcome != 'success'
        run: exit 1

      - name: Admin tests
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @platform/web-admin test 2>&1 | tee admin-tests.log

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-ux-overhaul-tests
          path: admin-tests.log
          if-no-files-found: error
          retention-days: 7

      - name: Stop on test failure
        if: steps.tests.outcome != 'success'
        run: exit 1

      - name: Admin production build
        run: pnpm --filter @platform/web-admin build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run expanded Admin browser matrix
        id: browser
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm exec playwright test -c playwright.admin-matrix.config.ts 2>&1 | tee admin-browser.log

      - name: Upload browser matrix diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-ux-overhaul-browser
          path: |
            admin-browser.log
            test-results/admin-browser-matrix/**
            playwright-report/admin-browser-matrix/**
          if-no-files-found: warn
          retention-days: 14

      - name: Stop on browser matrix failure
        if: steps.browser.outcome != 'success'
        run: exit 1

      - name: Remove one-shot automation
        run: rm -f .github/workflows/admin-ux-ui-overhaul.yml .github/scripts/apply-admin-ux-ui-overhaul.py .github/scripts/patch-admin-overhaul-typecheck.py .github/scripts/patch-admin-overhaul-tests.py admin-typecheck.log admin-tests.log admin-browser.log

      - name: Commit and push validated overhaul
        shell: bash
        env:
          BRANCH_NAME: agent/admin-ux-ui-overhaul
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(admin): complete UX UI overhaul"
          git push origin "HEAD:${BRANCH_NAME}"
