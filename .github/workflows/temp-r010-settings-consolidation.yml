name: Temporary R-010 Settings Consolidation

on:
  push:
    branches:
      - fix/r010-settings-query-consolidation

permissions:
  contents: write

concurrency:
  group: temp-r010-settings-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/r010-settings-query-consolidation
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - name: Apply bounded settings consolidation
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          import json
          from pathlib import Path

          service_path = Path('apps/api/src/modules/settings/settings.service.ts')
          source = service_path.read_text(encoding='utf-8')
          original = source

          repeated_query = """    const settings = await this.prisma.siteSetting.findMany({
                where: { group: GROUP_TO_PRISMA[normalized] as any },
                orderBy: { key: 'asc' },
              });"""
          helper_call = "    const settings = await this.getAdminGroupSettings(normalized);"
          if repeated_query in source:
              count = source.count(repeated_query)
              if count != 2:
                  raise SystemExit(f'expected 2 repeated settings queries, found {count}')
              source = source.replace(repeated_query, helper_call)
          elif source.count(helper_call) != 2:
              raise SystemExit('settings helper calls are neither original nor fully consolidated')

          publish_query = """    const draftSettings = (await this.prisma.siteSetting.findMany({
                where: { group: GROUP_TO_PRISMA[normalized] as any },
                orderBy: { key: 'asc' },
              })).filter((setting) => this.isDraftKey(setting.key));"""
          publish_helper = "    const draftSettings = (await this.getAdminGroupSettings(normalized)).filter((setting) => this.isDraftKey(setting.key));"
          if publish_query in source:
              if source.count(publish_query) != 1:
                  raise SystemExit('expected exactly one publish settings query')
              source = source.replace(publish_query, publish_helper)
          elif publish_helper not in source:
              raise SystemExit('publish settings query is neither original nor consolidated')

          insertion = """  private async getAdminGroupSettings(group: SettingGroupSlug) {
              return this.prisma.siteSetting.findMany({
                where: { group: GROUP_TO_PRISMA[group] as any },
                orderBy: { key: 'asc' },
              });
            }

          """
          marker = "  private async getPublicGroup(group: SettingGroupSlug) {"
          if insertion not in source:
              if source.count(marker) != 1:
                  raise SystemExit('expected one getPublicGroup insertion marker')
              source = source.replace(marker, insertion + marker)

          if source != original:
              service_path.write_text(source, encoding='utf-8')

          ledger_path = Path('docs/evidence/r010-query-review.json')
          ledger = json.loads(ledger_path.read_text(encoding='utf-8'))
          ledger['findings'].pop('duplicate:ddca9b0bf8f104cc9d6784f7', None)
          ledger_path.write_text(json.dumps(ledger, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
      - name: Verify settings and query ownership
        shell: bash
        run: |
          pnpm --filter @platform/api exec jest src/modules/settings --runInBand --passWithNoTests
          pnpm typecheck:api
          R010_DUPLICATE_QUERY_STRICT=1 node tools/audit-r010-query-inventory.mjs
          node tools/audit-r010-query-review-ledger.mjs
      - name: Commit verified consolidation
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Settings consolidation is already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- apps/api/src/modules/settings/settings.service.ts docs/evidence/r010-query-review.json
          git commit -m 'refactor(settings): consolidate admin group query ownership'
          git push origin HEAD:fix/r010-settings-query-consolidation
