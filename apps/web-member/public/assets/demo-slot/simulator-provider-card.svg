<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Simulator Provider</title>
  <desc id="desc">Purple provider card for the wallet-backed demo slot.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12051f"/>
      <stop offset="0.5" stop-color="#4c1d95"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7ae"/>
      <stop offset="0.55" stop-color="#facc15"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="1200" height="560" rx="50" fill="url(#bg)"/>
  <circle cx="1020" cy="95" r="230" fill="#a855f7" opacity=".18"/>
  <circle cx="115" cy="520" r="250" fill="#facc15" opacity=".08"/>
  <g transform="translate(95 86)" filter="url(#shadow)">
    <rect width="340" height="388" rx="48" fill="#090312" stroke="url(#gold)" stroke-width="12"/>
    <rect x="38" y="72" width="264" height="190" rx="25" fill="#f8fafc"/>
    <g font-family="Arial, sans-serif" font-size="92" font-weight="900" text-anchor="middle">
      <text x="82" y="203" fill="#7c3aed">7</text>
      <text x="170" y="203">💎</text>
      <text x="258" y="203" fill="#7c3aed">7</text>
    </g>
    <rect x="78" y="302" width="184" height="50" rx="25" fill="url(#gold)"/>
    <text x="170" y="337" text-anchor="middle" fill="#2e1065" font-family="Arial, sans-serif" font-size="25" font-weight="900">SPIN</text>
  </g>
  <g transform="translate(500 125)">
    <text fill="#c4b5fd" font-family="Arial, sans-serif" font-size="29" font-weight="800" letter-spacing="8">DEMO PROVIDER</text>
    <text y="95" fill="#ffffff" font-family="Arial, sans-serif" font-size="82" font-weight="900">SIMULATOR</text>
    <text y="170" fill="url(#gold)" font-family="Arial, sans-serif" font-size="62" font-weight="900">FORTUNE SLOT</text>
    <text y="235" fill="#ddd6fe" font-family="Arial, sans-serif" font-size="31" font-weight="700">Wallet-backed BET / WIN testing</text>
    <g transform="translate(0 282)">
      <rect width="410" height="66" rx="33" fill="#ffffff" opacity=".09" stroke="#c4b5fd" stroke-opacity=".36"/>
      <circle cx="38" cy="33" r="10" fill="#4ade80"/>
      <text x="65" y="43" fill="#86efac" font-family="Arial, sans-serif" font-size="27" font-weight="800">SIMULATOR MODE ONLY</text>
    </g>
  </g>
</svg>
