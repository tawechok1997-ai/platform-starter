<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Demo Fortune Slot</title>
  <desc id="desc">Purple and gold slot machine cover for the provider simulator.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="20%" r="90%">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.5" stop-color="#2e1065"/>
      <stop offset="1" stop-color="#090312"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7ae"/>
      <stop offset="0.45" stop-color="#facc15"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#ddd6fe"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="900" height="1200" rx="72" fill="url(#bg)"/>
  <circle cx="450" cy="190" r="210" fill="#a855f7" opacity=".14"/>
  <g fill="#fde68a" opacity=".7">
    <circle cx="135" cy="170" r="7"/><circle cx="755" cy="255" r="9"/><circle cx="700" cy="110" r="5"/>
    <circle cx="210" cy="330" r="5"/><circle cx="785" cy="500" r="6"/><circle cx="105" cy="520" r="8"/>
  </g>
  <text x="450" y="175" text-anchor="middle" fill="#ede9fe" font-family="Arial, sans-serif" font-size="42" font-weight="800" letter-spacing="9">PROVIDER SIMULATOR</text>
  <text x="450" y="280" text-anchor="middle" fill="url(#gold)" font-family="Arial, sans-serif" font-size="94" font-weight="900">FORTUNE</text>
  <text x="450" y="355" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="62" font-weight="900" letter-spacing="18">SLOT</text>
  <g transform="translate(105 410)">
    <rect width="690" height="510" rx="58" fill="#140921" stroke="url(#gold)" stroke-width="18"/>
    <rect x="42" y="70" width="606" height="310" rx="34" fill="#050208" stroke="#a78bfa" stroke-width="6"/>
    <g transform="translate(72 100)">
      <rect width="160" height="250" rx="25" fill="url(#glass)"/>
      <rect x="187" width="160" height="250" rx="25" fill="url(#glass)"/>
      <rect x="374" width="160" height="250" rx="25" fill="url(#glass)"/>
      <text x="80" y="167" text-anchor="middle" font-family="Arial, sans-serif" font-size="112">💎</text>
      <text x="267" y="167" text-anchor="middle" font-family="Arial, sans-serif" font-size="112">7</text>
      <text x="454" y="167" text-anchor="middle" font-family="Arial, sans-serif" font-size="112">⭐</text>
    </g>
    <rect x="188" y="418" width="314" height="66" rx="33" fill="url(#gold)" filter="url(#glow)"/>
    <text x="345" y="464" text-anchor="middle" fill="#2e1065" font-family="Arial, sans-serif" font-size="36" font-weight="900">SPIN &amp; SETTLE</text>
  </g>
  <g transform="translate(155 975)">
    <rect width="590" height="105" rx="52" fill="#ffffff" opacity=".08" stroke="#c4b5fd" stroke-opacity=".35"/>
    <text x="295" y="48" text-anchor="middle" fill="#ddd6fe" font-family="Arial, sans-serif" font-size="29" font-weight="700">BET • WIN • REFUND • ROLLBACK</text>
    <text x="295" y="80" text-anchor="middle" fill="#86efac" font-family="Arial, sans-serif" font-size="24" font-weight="800">MEMBER WALLET CREDIT</text>
  </g>
</svg>
